<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Netflix</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 233 233'%3E%3Crect width='233' height='233' rx='38' fill='%23000'/%3E%3Cg transform='translate(57 22)'%3E%3Cpath d='M0 0H37V233H0V0Z' fill='%23b0050f'/%3E%3Cpath d='M82 0H119V233H82V0Z' fill='%23b0050f'/%3E%3Cpath d='M82 233H119L35 0H0L82 233Z' fill='%23e30511'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://image.tmdb.org">
<style>
:root{
  --red:#e50914; --red-h:#f40612;
  --bg:#000; --bg-2:#141414; --bg-3:#1f1f1f; --bg-4:#2a2a2a;
  --fg:#fff; --fg-2:#b3b3b3; --fg-3:#808080;
  --line:rgba(255,255,255,.10);
  --gold:#f5c518; --green:#46d369;
  --ease:cubic-bezier(.25,.46,.45,.94);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --nav-h:68px; --pad:clamp(18px, 4vw + 8px, 76px);
  --card-w:clamp(128px,14.5vw,210px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:"Netflix Sans","Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{overflow-x:hidden}
body.locked{overflow:hidden}
img{display:block;border:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
::selection{background:var(--red);color:#fff}
::-webkit-scrollbar{width:0;height:0}
.hidden{display:none!important}

.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:900;
  display:flex;align-items:center;gap:26px;padding:0 var(--pad);
  transition:background .35s var(--ease),backdrop-filter .35s;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.42) 55%,transparent 100%);
  pointer-events:none}
.nav.solid{background:#141414;backdrop-filter:blur(8px)}
.nav>*{pointer-events:auto}
.logo{cursor:pointer;display:flex;align-items:center;user-select:none;
  transition:transform .22s var(--ease-out)}
.logo:hover{transform:scale(1.06)}
.nlogo{width:20.5px;height:40px;display:block;
  filter:drop-shadow(0 1px 10px rgba(229,9,20,.5))}
.nav-links{display:flex;gap:22px;font-size:14px;color:var(--fg-2)}
.nav-links span{cursor:pointer;transition:color .2s}
.nav-links span:hover,.nav-links span.on{color:#fff}
.nav-links span.on{font-weight:600}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;color:#fff;
  opacity:.92;transition:opacity .2s,transform .2s}
.icon-btn:hover{opacity:1;transform:scale(1.1)}
.avatar{width:32px;height:32px;border-radius:4px;
  background:linear-gradient(135deg,#e50914,#7a0a12);display:grid;place-items:center;
  font-size:13px;font-weight:800;letter-spacing:-.5px}

/* 夸克账号按钮 */
.quark-account{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  border-radius:6px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);color:#ddd;font-size:13px;
  transition:.2s var(--ease);white-space:nowrap}
.quark-account:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.32);color:#fff}
.quark-account .qa-ico{display:flex;opacity:.9}
.quark-account.on{border-color:rgba(111,182,245,.5);background:rgba(14,39,64,.7);color:#8ec8ff}
.qa-dot{width:6px;height:6px;border-radius:50%;background:#666;transition:.3s}
.quark-account.on .qa-dot{background:#46d369;box-shadow:0 0 8px rgba(70,211,105,.9)}

/* 夸克面板 */
.qk-box{background:#1a1a1a;border:1px solid rgba(255,255,255,.08);border-radius:8px;
  padding:4px 16px;margin-top:16px}
.qk-row{display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px}
.qk-row:last-child{border-bottom:0}
.qk-row span{color:var(--fg-3)}
.qk-row b{font-weight:600;color:#e8e8e8;text-align:right}

.searchbox{position:relative;flex:1;max-width:0;overflow:hidden;
  transition:max-width .38s var(--ease-out),opacity .28s;opacity:0;
  display:flex;align-items:center;margin-left:0}
.searchbox.open{max-width:380px;opacity:1;margin-left:6px}
.searchbox input{width:100%;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.24);
  color:#fff;font-size:14.5px;padding:9px 14px 9px 38px;border-radius:4px;outline:none;
  transition:border-color .2s}
.searchbox input:focus{border-color:rgba(255,255,255,.7);background:rgba(0,0,0,.92)}
.searchbox .mag{position:absolute;left:12px;color:var(--fg-3);pointer-events:none}

.hero{position:relative;height:min(78vh,700px);min-height:500px;
  overflow:hidden;background:#0b0b0b}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.15s var(--ease);}
.hero-slide.on{opacity:1}
.hero-slide img{width:100%;height:100%;object-fit:cover;object-position:center 22%;
  transform:scale(1.04);transition:transform 9s linear}
.hero-slide.on img{transform:scale(1.12)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.62) 34%,rgba(0,0,0,.10) 66%,rgba(0,0,0,.30) 100%),
    linear-gradient(0deg,var(--bg) 0%,rgba(0,0,0,.82) 9%,rgba(0,0,0,.32) 32%,transparent 52%,transparent 72%,rgba(0,0,0,.58) 100%)}
.hero-body{position:absolute;left:var(--pad);bottom:64px;z-index:3;width:min(620px,52vw)}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;
  font-weight:700;letter-spacing:1.6px;color:#dcdcdc;margin-bottom:14px}
.hero-badge b{color:var(--red);letter-spacing:.5px}
.hero-title{font-size:clamp(38px,5.2vw,68px);font-weight:900;line-height:1.02;
  letter-spacing:-2.4px;margin:0 0 16px;text-shadow:0 3px 26px rgba(0,0,0,.72)}
.hero-meta{display:flex;align-items:center;gap:13px;font-size:14.5px;
  color:#d7d7d7;margin-bottom:15px;flex-wrap:wrap}
.hero-meta .match{color:var(--green);font-weight:800}
.hero-meta .hd{border:1px solid rgba(255,255,255,.42);border-radius:3px;
  padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.6px}
.hero-meta .r{color:var(--gold);font-weight:700}
.hero-ov{font-size:15.5px;line-height:1.62;color:#e2e2e2;
  text-shadow:0 2px 12px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;margin-bottom:24px;max-width:560px}
.hero-actions{display:flex;gap:12px}
.btn{display:inline-flex;align-items:center;gap:9px;font-size:16px;font-weight:700;
  padding:11px 26px;border-radius:5px;transition:transform .16s var(--ease),background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-white{background:#fff;color:#000}
.btn-white:hover{background:rgba(255,255,255,.82)}
.btn-gray{background:rgba(109,109,110,.7);color:#fff;backdrop-filter:blur(6px)}
.btn-gray:hover{background:rgba(109,109,110,.52)}
.hero-dots{position:absolute;right:var(--pad);bottom:80px;z-index:4;display:flex;gap:8px}
.hero-dots i{width:22px;height:3px;background:rgba(255,255,255,.32);border-radius:2px;
  cursor:pointer;transition:.3s}
.hero-dots i.on{background:#fff;width:34px}

.rows.navpad{padding-top:0}
.rows{position:relative;z-index:5;padding-top:34px;padding-bottom:80px}
.row{margin:0 0 34px;position:relative}
.row-head{display:flex;align-items:baseline;gap:12px;padding:0 0 9px var(--pad);
  font-size:clamp(15px,1.42vw,21px);font-weight:700}
.row-head small{font-size:12.5px;font-weight:400;color:var(--fg-3)}
.row-body{position:relative}
.row-track{display:flex;gap:7px;padding:14px 0 24px;overflow-x:auto;overflow-y:hidden;
  scroll-behavior:smooth;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
/* 首尾留白（注意：不能用 scroll-snap，会把 margin 吸附掉）*/
.row-track>.card:first-child{margin-left:var(--pad)}
.row-track>.card:last-child{margin-right:var(--pad)}
.row-track::-webkit-scrollbar{display:none}
.arrow{position:absolute;top:36px;bottom:24px;width:calc(var(--pad) + 4px);z-index:20;
  background:linear-gradient(90deg,rgba(0,0,0,.86),transparent);border:0;
  display:grid;place-items:center;opacity:0;transition:opacity .22s;color:#fff}
.arrow.r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.86),transparent)}
.arrow.l{left:0}
.row:hover .arrow{opacity:1}
.arrow:hover{background:linear-gradient(90deg,rgba(0,0,0,.94),rgba(0,0,0,.3))}

.card{flex:0 0 var(--card-w);width:var(--card-w);scroll-snap-align:start;
  position:relative;cursor:pointer;transition:transform .34s var(--ease-out);will-change:transform}
.card-img{position:relative;border-radius:5px;overflow:hidden;background:var(--bg-3);
  aspect-ratio:2/3;box-shadow:0 2px 14px rgba(0,0,0,.5)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:filter .3s}
.card-rank{position:absolute;left:-15px;bottom:-6px;font-size:clamp(58px,7.4vw,104px);
  font-weight:900;line-height:.76;letter-spacing:-7px;color:#000;
  -webkit-text-stroke:3px rgba(255,255,255,.75);pointer-events:none;z-index:2;
  text-shadow:0 4px 20px rgba(0,0,0,.55)}
.card-q{position:absolute;top:8px;left:8px;z-index:3;font-size:10.5px;font-weight:800;
  letter-spacing:.5px;padding:3px 7px;border-radius:3px;
  background:rgba(0,0,0,.78);border:1px solid rgba(70,211,105,.6);color:var(--green)}
.card-q.uhd{border-color:rgba(255,255,255,.42);color:#fff}
.card-rate{position:absolute;bottom:7px;right:8px;z-index:3;font-size:11.5px;font-weight:800;
  color:var(--gold);text-shadow:0 1px 6px #000}
.card:hover{transform:translateZ(0) scale(1.13);z-index:60}
.card:hover .card-img img{filter:brightness(.72)}
.card-hover{position:absolute;inset:0;z-index:4;opacity:0;transition:opacity .26s var(--ease);
  display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(0deg,rgba(0,0,0,.94) 0%,rgba(0,0,0,.35) 52%,rgba(0,0,0,.10) 100%);
  padding:10px}
.card:hover .card-hover{opacity:1}
.card-hover .tt{font-size:12.5px;font-weight:700;line-height:1.28;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-hover .acts{display:flex;gap:6px;margin-bottom:7px}
.cbtn{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
  background:rgba(42,42,42,.92);border:1.5px solid rgba(255,255,255,.42);color:#fff;
  transition:.16s}
.cbtn:hover{background:#fff;color:#000;border-color:#fff}
.cbtn.play{background:#fff;color:#000;border-color:#fff}
.cbtn svg{width:12px;height:12px}
.card-hover .inf{font-size:10px;color:#cfcfcf;display:flex;gap:6px;flex-wrap:wrap;
  align-items:center;line-height:1.4}
.card-hover .inf .g{color:var(--green);font-weight:700}
.card-skel{flex:0 0 var(--card-w);aspect-ratio:2/3;border-radius:5px;
  background:linear-gradient(100deg,#1b1b1b 24%,#262626 46%,#1b1b1b 70%);
  background-size:220% 100%;animation:shim 1.5s infinite}
@keyframes shim{0%{background-position:120% 0}100%{background-position:-120% 0}}

/* ─── 夸克播放器 ─── */
/* ─── 筛选板块（Netflix 风格） ─── */
/* ─── 影片详情页 ─── */
.md-hero{position:relative;height:clamp(210px,30vw,400px);
  background-size:cover;background-position:center 22%;background-color:#1a1a1a}
.md-hero::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.1) 42%,#141414 100%)}
.md-back{position:absolute;top:clamp(78px,9vh,100px);left:clamp(18px,3vw,52px);z-index:3;
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;
  backdrop-filter:blur(6px);transition:background .18s}
.md-back:hover{background:rgba(255,255,255,.2)}
.md-body{position:relative;margin-top:-108px;z-index:2;
  padding:0 clamp(18px,3vw,52px);display:flex;gap:clamp(16px,2.4vw,30px);
  align-items:flex-start}
.md-poster{width:clamp(112px,13vw,172px);aspect-ratio:2/3;object-fit:cover;
  border-radius:7px;flex:none;box-shadow:0 12px 42px rgba(0,0,0,.85);background:#222}
.md-info{flex:1;min-width:0;padding-top:clamp(52px,6vw,92px)}
.md-title{font-size:clamp(24px,3.4vw,44px);font-weight:900;letter-spacing:-1.5px;
  line-height:1.12;margin:0 0 9px;color:#fff}
.md-meta{display:flex;gap:13px;align-items:center;flex-wrap:wrap;
  font-size:13.5px;color:#b3b3b3;margin-bottom:13px}
.md-rate{color:#f5c518;font-weight:700}
.md-overview{font-size:14px;line-height:1.85;color:#c8c8c8;margin:0;max-width:76ch}
.md-src{margin-top:34px;padding:0 clamp(18px,3vw,52px) 70px}
.md-sec{font-size:13px;font-weight:700;color:#c0c0c0;margin:22px 0 11px;
  letter-spacing:.3px}
.md-sec span{color:#7d7d7d;font-weight:500;margin-left:8px}
.md-loading{padding:34px 0;color:#8a8a8a;font-size:13.5px;display:flex;
  align-items:center;gap:10px}
.sr-head{padding-top:calc(var(--nav-h) + 16px) !important}
.bw-wrap{padding:calc(var(--nav-h) + clamp(10px,1.6vw,22px)) 0 70px;min-height:70vh}
.bw-hero{padding:0 var(--pad) 18px}
.bw-title{font-size:clamp(26px,3.2vw,44px);font-weight:900;letter-spacing:-1.4px;
  margin:0 0 4px;color:#fff}
.bw-sub{font-size:13px;color:var(--fg-3)}
.fv-wrap{padding:calc(var(--nav-h) + clamp(12px,1.8vw,24px)) var(--pad) 70px;
  min-height:70vh}
.fv-head{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
.fv-title{font-size:clamp(24px,2.8vw,36px);font-weight:900;letter-spacing:-1.2px;
  margin:0;color:#fff}
.fv-count{font-size:13px;color:var(--fg-3)}
.fv-sel{font-size:13px;color:#8a8a8a;margin:0 0 22px}
.fv-sel b{color:#e30511;font-weight:600}

.frows{border-top:1px solid rgba(255,255,255,.07);margin-bottom:26px}
.frow{display:flex;gap:18px;align-items:flex-start;
  padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055)}
.fk{flex:none;width:52px;font-size:13px;color:#7d7d7d;line-height:2.05;
  letter-spacing:.3px}
.fv{display:flex;flex-wrap:wrap;gap:0 17px;flex:1;min-width:0}
.fo{background:none;border:none;padding:4px 0;font-size:13.5px;line-height:1.6;
  color:#b0b0b0;cursor:pointer;transition:color .14s;font-family:inherit;
  letter-spacing:.2px;white-space:nowrap}
.fo:hover{color:#fff}
.fo.on{color:#fff;font-weight:700}
.fo.on::after{content:'';display:block;height:2px;margin-top:1px;
  background:#e30511;border-radius:1px}

.fv-grid{display:grid;gap:clamp(10px,1.3vw,17px);
  grid-template-columns:repeat(auto-fill,minmax(clamp(116px,11.5vw,156px),1fr))}
.fv-grid .card{flex:none;width:auto}
.fv-empty{padding:70px 0;text-align:center;color:var(--fg-3);font-size:14px}
.fv-more{display:flex;justify-content:center;margin-top:38px}
/* ══════════════════════════════════════════════════════════════
   播放器样式（唯一一套，勿再追加覆盖）
   层级：video 1 < 遮罩 8 < 控制条 9 < 顶栏 10 < 弹层 11
   ══════════════════════════════════════════════════════════════ */

.pl-wrap{position:fixed;inset:0;z-index:9500;background:#000;
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.pl-wrap.open{opacity:1;pointer-events:auto}

/* ---------- 顶栏 ---------- */
.pl-top{position:absolute;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:14px;
  padding:16px 26px 34px;
  background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,0));
  pointer-events:none;transition:opacity .22s}
.pl-top > *{pointer-events:auto}
.pl-top .pl-back{width:38px;height:38px;flex:none;border-radius:50%;
  border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;
  display:grid;place-items:center;transition:background .16s}
.pl-top .pl-back:hover{background:rgba(255,255,255,.22)}
.pl-top .pl-headtxt{min-width:0;flex:1}
.pl-top .pl-title{font-size:14.5px;font-weight:600;color:#fff;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top .pl-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.pl-top .pl-headacts{display:flex;align-items:center;gap:6px;margin-left:auto}

/* ---------- 主舞台 ---------- */
.pl-main{position:absolute;inset:0;display:flex}
.pl-stage{position:relative;flex:1;min-width:0;
  display:flex;align-items:center;justify-content:center;
  padding:76px 88px 104px;box-sizing:border-box}
.pl-body{position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;pointer-events:none}
.pl-body video{pointer-events:auto;
  max-width:calc(100% - 176px);max-height:calc(100% - 180px);
  width:auto;height:auto;object-fit:contain;
  background:#000;border-radius:8px;
  box-shadow:0 18px 54px rgba(0,0,0,.62)}

/* 遮罩（缓冲/错误）：不挡操作，只在视频区域 */
.pl-veil{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:rgba(0,0,0,.55);border-radius:8px;
  font-size:13.5px;color:#c8c8c8;pointer-events:none}
.pl-veil.hide{display:none}
.pl-veil .sp{width:30px;height:30px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.16);border-top-color:#e50914;
  animation:plspin .8s linear infinite}
.pl-veil .msg{max-width:min(520px,84vw);line-height:1.75;text-align:center}
.pl-veil .big{font-size:15px;font-weight:700;color:#fff}
.pl-veil .acts{display:flex;gap:10px;margin-top:4px;pointer-events:auto}
@keyframes plspin{to{transform:rotate(360deg)}}

/* 中央播放/暂停闪现 */
.pl-flash{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:8;
  width:78px;height:78px;border-radius:50%;background:rgba(0,0,0,.52);
  display:grid;place-items:center;color:#fff;pointer-events:none;
  opacity:0;transition:opacity .26s}
.pl-flash.show{opacity:1}

/* ---------- 控制条 ---------- */
.pl-ctrl{position:absolute;left:0;right:0;bottom:0;z-index:9;
  padding:46px 26px 18px;box-sizing:border-box;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 8%,rgba(0,0,0,.46) 60%,transparent);
  transition:opacity .22s}
.pl-prog{position:relative;height:18px;display:flex;align-items:center;
  cursor:pointer;margin-bottom:6px}
.pl-track{position:relative;width:100%;height:4px;border-radius:3px;
  background:rgba(255,255,255,.22);overflow:visible}
.pl-buf{position:absolute;left:0;top:0;height:100%;border-radius:3px;
  background:rgba(255,255,255,.34);width:0}
.pl-played{position:absolute;left:0;top:0;height:100%;border-radius:3px;
  background:#e50914;width:0}
.pl-knob{position:absolute;top:50%;translate:0 -50%;width:13px;height:13px;
  border-radius:50%;background:#e50914;box-shadow:0 0 0 4px rgba(229,9,20,.22);
  left:0;pointer-events:none;transition:opacity .16s}
.pl-prog:hover .pl-knob{opacity:1}

.pl-row{display:flex;align-items:center;gap:8px}
.pl-b{width:38px;height:38px;flex:none;border:none;border-radius:7px;

  transition:background .16s,color .16s}
.pl-b:hover{background:rgba(255,255,255,.14)}
.pl-b.on,.pl-b.accent{color:#e50914}
.pl-time{font-size:12.5px;color:#d2d2d2;font-variant-numeric:tabular-nums;
  margin:0 6px;white-space:nowrap}
.pl-grow{flex:1}

/* 音量：图标随音量变化 */
.pl-vol{display:flex;align-items:center;gap:2px}
.pl-vslider{width:0;overflow:hidden;transition:width .2s ease}
.pl-vol:hover .pl-vslider{width:82px}
.pl-vslider input{width:78px;margin:0 2px;accent-color:#e50914;cursor:pointer}
#plMute{position:relative}
#plMute path.w1,#plMute path.w2,#plMute path.w3{transition:opacity .18s}
#plMute.vol-low path.w2,#plMute.vol-low path.w3{opacity:.18}
#plMute.vol-mid path.w3{opacity:.18}
#plMute.vol-mute path.w1,#plMute.vol-mute path.w2,#plMute.vol-mute path.w3{opacity:.15}
#plMute.vol-mute::after{content:'';position:absolute;width:25px;height:2px;
  background:#e50914;transform:rotate(-45deg);border-radius:2px}

/* ---------- 右侧栏 ---------- */
.pl-side{flex:none;width:0;overflow:hidden;background:#0b0b0b;

.pl-side.on{width:304px;overflow-y:auto}
.pl-side::-webkit-scrollbar{width:7px}
.pl-side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
.pl-side-inner{padding:22px 18px}
.pl-side h4{margin:22px 0 11px;font-size:11.5px;letter-spacing:.9px;
  color:#828282;text-transform:uppercase;font-weight:600}
.pl-side h4:first-child{margin-top:0}
.pl-side .pl-info-title{font-size:15px;font-weight:700;color:#fff;
  line-height:1.55;margin-bottom:12px;word-break:break-word}
.pl-side .pl-info-meta{font-size:12.5px;color:#9a9a9a;line-height:1.95}
.pl-side .pl-info-meta b{color:#e8e8e8;font-weight:600}
.pl-side .pl-eps{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.pl-side .pl-eps .pe-btn{display:flex;align-items:center;justify-content:space-between;
  gap:6px}
.pl-side .pl-eps button{background:rgba(255,255,255,.075);
  border:1px solid transparent;color:#dadada;border-radius:6px;
  padding:9px 4px;font-size:12px;line-height:1.25;cursor:pointer;font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .15s,border-color .15s}
.pl-side .pl-eps button:hover{background:rgba(255,255,255,.17)}
.pl-side .pl-eps button.on{background:#e50914;color:#fff;border-color:#e50914;
  font-weight:600}

/* ---------- 字幕 / 音轨面板 ---------- */
.cc-panel,.ast-panel{position:fixed;right:26px;bottom:88px;z-index:9600;
  width:290px;max-height:62vh;overflow-y:auto;display:none;
  background:rgba(20,20,20,.985);border:1px solid rgba(255,255,255,.13);

  color:#e8e8e8;font-size:13px}

.cc-panel{bottom:88px}
.ast-panel{right:70px}
.cc-head{display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px 6px;color:#868686;font-size:11.5px;letter-spacing:.5px}
.cc-item,.ast-item{display:flex;align-items:center;justify-content:space-between;

.cc-item:hover,.ast-item:hover{background:rgba(255,255,255,.09)}

.cc-item.on .cc-tag,.ast-item.on .ast-tag{color:#ff5a63}

.ast-item .ast-bad{color:#e0a020}

/* ---------- UI 自动隐藏 ---------- */
.pl-wrap.hideui .pl-top,.pl-wrap.hideui .pl-ctrl{opacity:0;pointer-events:none}
/* 鼠标移到底部/顶部区域时，即使处于隐藏态也恢复响应（否则按钮点不到） */
.pl-wrap.hideui .pl-ctrl:hover,.pl-wrap.hideui .pl-top:hover{opacity:1;pointer-events:auto}
.pl-wrap.hideui{cursor:none}

/* ---------- 全屏 ---------- */
.pl-wrap:fullscreen{background:#000}
.pl-wrap:fullscreen .pl-stage{padding:0}
.pl-wrap:fullscreen .pl-body video{max-width:100%;max-height:100%;

.pl-wrap:fullscreen .pl-side.on{width:320px}

/* ---------- 无声提示卡（右上角）---------- */
.aud-card{position:fixed;top:76px;right:28px;z-index:9700;width:318px;
  background:rgba(26,26,26,.985);border:1px solid rgba(255,255,255,.14);

  line-height:1.65;animation:audIn .22s ease;transition:right .22s ease}

@keyframes audIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

.pe-q{font-size:10.5px;color:rgba(255,255,255,.45);

.pl-wrap.pseudo-fs{position:fixed;inset:0;z-index:9999;background:#000}
.pl-wrap.pseudo-fs .pl-stage{padding:0}

/* 快捷键反馈 */
.pl-toast{position:absolute;left:50%;bottom:132px;translate:-50% 0;z-index:12;

/* ══════════ 开屏动画 ══════════ */
#splash{position:fixed;inset:0;z-index:10000;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;transition:opacity .45s ease}
#splash.bye,#splash.gone{opacity:0;pointer-events:none}
#splash.bye{transition:opacity .45s ease}
#splCanvas{position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);display:block}
#splash .spl-ver{display:none;position:absolute;left:50%;top:calc(50% + 118px);
  transform:translateX(-50%);z-index:2;color:#e50914;
  font-size:clamp(38px,7vw,76px);font-weight:900;letter-spacing:.06em;
  text-transform:uppercase;font-family:'Helvetica Neue',Arial,sans-serif;
  text-shadow:0 6px 40px rgba(229,9,20,.5);
  animation:splVerIn 1.1s cubic-bezier(.2,.7,.3,1) both}
@keyframes splVerIn{
  from{opacity:0;transform:scale(.86)}
  to{opacity:1;transform:scale(1)}
}
#splash .spl-bar{position:absolute;left:0;right:0;bottom:0;
  z-index:2;width:100%;height:3px;border-radius:0;
  background:rgba(255,255,255,.14);overflow:hidden}
#splash .spl-bar i{display:block;height:100%;width:0;
  background:#e50914;transition:width .3s ease}
#splash .spl-skip{position:absolute;right:26px;bottom:26px;z-index:3;
  background:rgba(255,255,255,.12);color:#ddd;border:1px solid rgba(255,255,255,.2);
  border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:background .15s}
#splash .spl-skip:hover{background:rgba(255,255,255,.22)}
/* 开屏期间禁止滚动 */
html.spl-lock,body.spl-lock{overflow:hidden}


/* ══════ 全屏：无论全屏元素是 html/body/播放器，画面都要铺满 ══════ */
:fullscreen .pl-stage,
:-webkit-full-screen .pl-stage,
html.fs-on .pl-stage{padding:0}

:fullscreen .pl-main,
:-webkit-full-screen .pl-main,
html.fs-on .pl-main{position:absolute;inset:0}

:fullscreen .pl-body,
:-webkit-full-screen .pl-body,
html.fs-on .pl-body{position:absolute;inset:0}

:fullscreen .pl-body video,
:-webkit-full-screen .pl-body video,
html.fs-on .pl-body video{
  width:100%;height:100%;
  max-width:none;max-height:none;
  object-fit:contain;border-radius:0;box-shadow:none}

/* 全屏时侧栏贴边、控制条贴底 */
:fullscreen .pl-side.on,
html.fs-on .pl-side.on{width:300px;height:100%}


/* ══════════ 详情弹窗容器（原版缺失，补回）══════════ */
.detail-wrap{position:fixed;inset:0;z-index:9000;display:none;

.detail-wrap.open{display:block}
.detail-wrap::-webkit-scrollbar{width:9px}
.detail-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:5px}

.detail{width:min(940px,94vw);margin:44px auto 70px;background:#141414;
  border-radius:10px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.72)}
.detail .md{position:relative}

/* 片源行（原版缺失，补回）*/
.srow{display:flex;align-items:center;gap:14px;padding:13px 18px;
  background:#1c1c1c;border-bottom:1px solid rgba(255,255,255,.06)}
.srow:first-of-type{border-radius:8px 8px 0 0}
.srow:last-of-type{border-radius:0 0 8px 8px;border-bottom:none}
.srow:hover{background:#232323}
.srow.dead{opacity:.45}
.srow > div:nth-child(2){min-width:0;flex:1}
.s-score{width:44px;height:44px;flex:none;border-radius:7px;display:grid;
  place-items:center;font-size:15px;font-weight:700;color:#e6e6e6;background:#2c2c2c}
.s-score.mid{color:#e5b03c}
.s-score.low{color:#8b8b8b}
.s-t1{font-size:13.5px;color:#eaeaea;line-height:1.55;word-break:break-all;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.s-t2{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:11px;line-height:1.75;padding:0 7px;border-radius:3px;
  background:#2b2b2b;color:#b6b6b6;white-space:nowrap}
.tag.ok{background:#17351f;color:#4ed77b}
.tag.warn{background:#3a2f10;color:#e5b03c}
.tag.no{background:#3a1418;color:#ff6b73}
.s-btn{flex:none;border:none;border-radius:5px;font-family:inherit;
  font-size:13px;font-weight:600;padding:9px 18px;cursor:pointer;
  white-space:nowrap;transition:filter .15s}
.s-btn:hover{filter:brightness(1.12)}
.s-btn.primary{background:#e50914;color:#fff}
.s-btn.ghost,.s-btn:not(.primary){background:#f0f0f0;color:#111}
.s-btn[disabled]{background:#2b2b2b;color:#777;cursor:not-allowed}
.md-empty{padding:26px 0 10px;color:#8a8a8a;font-size:13.5px}

@media (max-width:820px){
  .detail{margin:20px auto 50px}
  .srow{flex-wrap:wrap}
}


/* 详情弹窗进入动画 */
@keyframes mdIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.detail-wrap.open .detail{animation:mdIn .22s ease both}
.detail-wrap.open{background:rgba(0,0,0,.78)}


.aac-badge{font-size:11.5px;color:#4ed77b;background:rgba(62,207,106,.14);
  border-radius:4px;padding:2px 8px;margin-left:4px;white-space:nowrap}

        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent += '[' + kind + '] ' + msg + '\n';
    } catch(e){}
  }
  window.addEventListener('error', function(ev){
    var t = ev.target;
    if (t && t.tagName && (t.tagName === 'IMG' || t.tagName === 'VIDEO' || t.tagName === 'SCRIPT')){
      bar('资源加载失败: ' + (t.src || t.currentSrc || '?'), 'resource');
      return;
    }
    bar((ev.message || 'error') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || 0), 'js');
  }, true);
  window.addEventListener('unhandledrejection', function(ev){
    var r = ev.reason;
    bar((r && (r.stack || r.message)) ? String(r.stack || r.message).split('\n')[0] : String(r), 'promise');
  });
  window.__flxErr = bar;
})();

/* 外链图片统一走 /api/img 代理（豆瓣防盗链 + Chrome ORB 都会拦直连） */
function proxyImg(u){
  u = String(u || '').trim();
  if (!u) return '';
  if (u.startsWith('data:') || u.startsWith('/') || u.startsWith('blob:')) return u;
  if (!/^https?:/i.test(u)) return u;
  if (u.indexOf('/api/img') >= 0) return u;
  // 只有这两类站有防盗链/被 ORB 拦截，才需要服务端转发；
  // 其他图直连更快，也不会被白名单拒绝（403）
  try {
    var h = new URL(u).hostname.toLowerCase();
    var needProxy = h.endsWith('doubanio.com') || h.endsWith('douban.com')
                 || h.endsWith('tmdb.org') || h.endsWith('image.tmdb.org');
    if (!needProxy) return u;
  } catch(e){
    return u;
  }
  return '/api/img?u=' + encodeURIComponent(u);
}

/* 详情页预热计时器（解析片源用，不转码） */
let _preTimer = null;


/* 失效条目收纳区（懒创建） */
function deadGroupOf(box){
  let g = box.querySelector('.dead-group');
  if (g) return g;
  g = document.createElement('div');
  g.className = 'dead-group';
  const head = document.createElement('div');
  head.className = 'dead-head';
  head.innerHTML = '<span class="dh-arrow">▶</span><span></span>';
  const body = document.createElement('div');
  body.className = 'dead-body';
  head.onclick = () => g.classList.toggle('open');
  g.appendChild(head);
  g.appendChild(body);
  box.appendChild(g);
  return g;
}

function foldRow(box, row){
  const g = deadGroupOf(box);
  const body = g.querySelector('.dead-body');
  if (row.parentElement !== body) body.appendChild(row);
  const n = body.querySelectorAll('.srow').length;
  const label = g.querySelector('.dead-head span:last-child');
  if (label) label.textContent = '已失效 ' + n + ' 个（点击展开）';
}

function foldDead(box){
  const dead = [...box.querySelectorAll('.srow.dead')].filter(r => !r.closest('.dead-body'));
  dead.forEach(r => foldRow(box, r));
  return dead.length;
}

/* 验证片源：只查未知的，查到失效立刻收走 */
async function verifySources(box){
  if (!box) return;
  const rows = [...box.querySelectorAll('.srow')].filter(r => {
    if (r.closest('.dead-body')) return false;
    if (r.classList.contains('dead')) return false;
    if (r.querySelector('.tag[data-vtag]')) return false;   // 已有结论
    const u = r.querySelector('.s-btn[data-url]');
    return u && /^https?:\/\/pan\.quark\.cn/i.test(u.dataset.url || '');
  });
  if (!rows.length) return;

  const check = async (row) => {
    const btn = row.querySelector('.s-btn[data-url]');
    const url = btn && btn.dataset.url;
    if (!url) return;
    const badge = document.createElement('span');
    badge.className = 'tag';
    badge.dataset.vtag = '1';
    badge.textContent = '检测中…';
    const t2 = row.querySelector('.s-t2');
    if (t2) t2.appendChild(badge);

    try {
      const j = await (await fetch('/api/check-share?share=' + encodeURIComponent(url))).json();
      if (j.alive){
        if (j.need_pwd){
          badge.className = 'tag warn';
          badge.textContent = '需提取码';
          row.dataset.needpwd = '1';
          const pb = row.querySelector('[data-play]');
          if (pb) pb.textContent = '输入提取码';
        } else {
          badge.className = 'tag ok';
          badge.textContent = '可用';
        }
      } else {
        badge.className = 'tag no';
        badge.textContent = j.error || '已失效';
        row.classList.add('dead');
        const pb = row.querySelector('[data-play]');
        if (pb){ pb.disabled = true; pb.classList.add('ghost'); pb.textContent = '已失效'; }
        foldRow(box, row);          // 立刻收走，不等全部查完
      }
    } catch(e){
      badge.textContent = '检测失败';
      badge.className = 'tag';
    }
  };

  for (let i = 0; i < rows.length; i += 3){
    await Promise.all(rows.slice(i, i + 3).map(check));
  }
}

function renderSources(data){
  try { window.__detailSrc = (data && ((data.resources||[]).concat(data.unknown_resolution||[]))) || []; } catch(e){}
  const box = $('#mdSrc');
  if (!box) return;
  const res = data.resources || [];
  const unk = data.unknown_resolution || [];
  const isMag = r => ['magnet','ed2k'].includes(r.pan_type);
  const pan = [...res.filter(r=>!isMag(r)), ...unk.filter(r=>!isMag(r))];
  const mag = [...res.filter(isMag), ...unk.filter(isMag)];

  if (!pan.length && !mag.length){
    box.innerHTML = '<div class="md-empty">没有找到网盘片源。换个片名试试，或稍后再搜。</div>';
    return;
  }

  let html = '';
  if (pan.length){
    html += `<div class="md-sec">网盘片源<span>${pan.length} 个</span></div>`;
    html += pan.map(r => srcRowHtml(r, unk.includes(r))).join('');
  }
  if (mag.length){
    html += `<div class="md-sec" style="margin-top:30px">磁力种子<span>${mag.length} 个</span></div>`;
    html += mag.map(r => srcRowHtml(r, unk.includes(r))).join('');
  }
  box.innerHTML = html;

  // 已经有缓存结论的失效条目，立刻收走（不等网络）
  foldDead(box);

  // 其余未知状态的，边显示边查
  setTimeout(() => verifySources(box), 150);

  // 预热：详情页停留 2 秒就把第一个夸克片源解析好（转存+取直链），点播放时直接起
  try {
    const firstQ = [...pan, ...mag].find(r =>
      r.pan_type === 'quark' && r.pan_url && r.live_state !== 'dead');
    if (firstQ){
      _preTimer = setTimeout(async () => {
        try {
          await fetch('/api/play?share=' + encodeURIComponent(firstQ.pan_url)
            + '&title=' + encodeURIComponent(firstQ.title || ''));
        } catch(e){}
      }, 2000);
    }
  } catch(e){}
}

  if (_currentMovie){
    const m = _currentMovie;
    openMovieDetail(m);      // 重新渲染详情（片源会走缓存，很快）
  } else {
    closeDetail();
  }
}

function closeDetail(fromPop){
  const wrap = $('#detailWrap');
  const wasOpen = wrap && wrap.classList.contains('open');
  if (wasOpen){
    wrap.classList.remove('open');
    document.body.classList.remove('locked');
    $('#detail').innerHTML = '';
  }
  // 只在用户主动点「返回」时还原视图；
  // 由浏览器前进/后退触发的那次（fromPop）不重复还原。
  if (!fromPop && _detailFromView){
    const v = _detailFromView, q = _detailFromQuery;
    _detailFromView = null;
    _detailFromQuery = null;
    _currentMovie = null;
    restoreView(v, q);
  } else if (fromPop){
    _detailFromView = null;
    _detailFromQuery = null;
  }
}

async function runSearch(title, noPush){
  markSearchOrigin();
  stopHeroTimer();
  setTab('search');
  $('#searchbox').classList.remove('open');
  $('#q').blur();
  state.lastSearch = title;
  if (!noPush) pushView('search', title);
  const rows = $('#rows');
  $('#hero').classList.add('hidden');
  $('#footer').classList.remove('hidden');
  rows.innerHTML = `
    <div class="loader-note" style="padding-top:34px"><span class="spin"></span> 正在搜索「${esc(title)}」…
      首次 8~20 秒（实时验活），之后走缓存毫秒级</div>
    <section class="row"><div class="row-head">片源</div>
      <div class="row-track" style="padding-bottom:10px">
        ${Array.from({length:5},()=>'<div class="card-skel"></div>').join('')}
      </div></section>`;
  scrollTo({top:0, behavior:'smooth'});
  try {
    const j = await (await fetch('/api/search?q=' + encodeURIComponent(title))).json();
    if (!j.ok) { rows.innerHTML = `<div class="err" style="margin:34px var(--pad) 0">${esc(j.error||'搜索失败')}</div>`; return; }

  } catch(e){
    rows.innerHTML = `<div class="err" style="margin:34px var(--pad) 0">请求失败：${esc(e.message)}</div>`;
  }
}

      <div class="src-stats">

  $('#srBack').onclick = ()=> goBackFromSearch();

function porow(arr){ return arr.map(r=>srcRowHtml(r,true)).join(''); }

function srcRowHtml(r, unknownRes){
  const q = r.quality || {};
  const tags = [];
  if (r.pan_type) tags.push(`<span class="tag ${esc(r.pan_type)}">${esc(r.pan_type)}</span>`);
  if (unknownRes || r.resolution_unknown){
    tags.push('<span class="tag hi">分辨率待核实</span>');
  } else {
    if (q.resolution) tags.push(`<span class="tag ok">${esc(q.resolution)}</span>`);
    if (q.source) tags.push(`<span class="tag">${esc(q.source)}</span>`);
    if (q.hdr && q.hdr.length) tags.push(`<span class="tag hi">${esc(q.hdr.join('/'))}</span>`);
  }
  if (q.subtitle) tags.push(`<span class="tag ok">${{embedded_bilingual:'内封双语',embedded_cn:'内嵌中文',external:'外挂字幕'}[q.subtitle]||q.subtitle}</span>`);
  if (q.size_gb) tags.push(`<span class="tag">${q.size_gb>=1?q.size_gb.toFixed(1)+' GB':(q.size_gb*1024).toFixed(0)+' MB'}</span>`);
  if (r.needs_offline) tags.push('<span class="tag no">磁力·需离线下载</span>');
  if (r.audio_ok === false) tags.push('<span class="tag no">' + (r.audio_label || '杜比音轨') + '·无声</span>');
  else if (r.audio_ok === true && r.audio_label) tags.push('<span class="tag">' + r.audio_label + '</span>');
  if (r.live_state === 'ok') tags.push('<span class="tag ok">已验证可用</span>');
    if (r.live_state === 'pwd') tags.push('<span class="tag warn">需提取码</span>');
  if (r.live_state === 'dead') tags.push(`<span class="tag no">${esc(r.dead_reason||'已失效')}</span>`);
  if ((r.sources||[]).length >= 2) tags.push('<span class="tag ok">双源</span>');

  const sc = r.score >= 90 ? '' : (r.score >= 60 ? 'mid' : 'low');
  const isQuark = r.pan_type === 'quark' && r.live_state !== 'dead';
  const canProbe = ['quark','aliyun','baidu','uc','115','123'].includes(r.pan_type);

  const canPlay = r.pan_type === 'quark' && r.live_state !== 'dead';
  return `<div class="srow ${r.live_state==='dead'?'dead':''}">
    <div class="s-score ${sc}">${Math.round(r.score)}</div>
    <div><div class="s-t1">${esc(r.title)}</div><div class="s-t2">${tags.join('')}</div></div>
    ${canPlay ? `<button class="s-btn primary" data-play="1"
       data-url="${esc(r.pan_url)}" data-pwd="${esc(r.passcode||'')}"
       data-title="${esc(r.title)}">${r.live_state==='pwd'?'输入提取码':'▶ 播放'}</button>` : ''}
    <button class="s-btn ${canProbe?'':'ghost'}" data-url="${esc(r.pan_url)}" data-pwd="${esc(r.passcode||'')}" ${canProbe?'':'disabled'}>
      ${isQuark?(unknownRes?'核实':'看剧集'):(canProbe?'打开':'不可用')}</button>
  </div>`;
}

let _uiTimer = null;

function bindPlayerUI(){
  const v = document.querySelector('#plBody video');
  if (!v || v.__bound) return;
  v.__bound = true;

  const wrap = $('#plWrap');
  const prog = $('#plProg'), played = $('#plPlayed'), buf = $('#plBuf'), knob = $('#plKnob');
  const btn = $('#plToggle'), timeEl = $('#plTime');
  const muteB = $('#plMute'), volS = $('#plVol');
  const ccB = $('#plCC'), ccFile = $('#ccFile');
  const astB = $('#plAudio');
  if (astB) astB.onclick = () => astToggle();

  // 右侧信息区开关
  const sideEl = $('#plSide'), sideBtn = $('#plSideBtn');
  const syncSide = () => {
    const on = sideEl && sideEl.classList.contains('on');
    if (sideBtn) sideBtn.style.color = on ? '#e50914' : '';
    const w = $('#plWrap');
    if (w) w.classList.toggle('sideon', !!on);
    const card = document.querySelector('.aud-card');
    if (card) card.classList.toggle('side-shift', !!on);
  };
  if (sideBtn) sideBtn.onclick = () => {
    if (!sideEl) return;
    sideEl.classList.toggle('on');
    syncSide();
  };
  const sideClose = $('#plSideToggle');
  if (sideClose) sideClose.onclick = () => {
    if (sideEl) sideEl.classList.remove('on');
    syncSide();
  };
  if (ccB && !ccB.__bound){ ccB.__bound = true; ccB.onclick = () => ccTogglePanel(); }
  if (ccFile && !ccFile.__bound){ ccFile.__bound = true; ccFile.onchange = () => {
    const f = ccFile.files && ccFile.files[0];
    ccFile.value = '';
    if (f) ccLoadLocal(f);
  }; }
  const fullB = $('#plFull'), pipB = $('#plPip');

  const fmt = t => {
    if (!isFinite(t) || t < 0) t = 0;
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = Math.floor(t % 60);
    return h ? (h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0'))
             : (m + ':' + String(sec).padStart(2,'0'));
  };

  const paint = () => {
    const d = v.duration, c = v.currentTime;
    if (isFinite(d) && d > 0){
      const p = (c / d) * 100;
      if (played) played.style.width = p + '%';
      if (knob) knob.style.left = p + '%';
    }
    if (timeEl) timeEl.textContent = fmt(c) + ' / ' + fmt(d);
    if (btn){
      // 只在状态真的变了才重建 SVG（否则每 250ms 重绘会闪）
      const want = v.paused ? 'play' : 'pause';
      if (btn.__icon !== want){
        btn.__icon = want;
        btn.innerHTML = (want === 'play')
          ? '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
          : '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
      }
    }
    try {
      if (v.buffered.length && buf){
        const end = v.buffered.end(v.buffered.length - 1);
        buf.style.width = ((end / (isFinite(d) && d ? d : end)) * 100) + '%';
      }
    } catch(e){}
  };

  ['timeupdate','durationchange','progress','play','pause','loadedmetadata','seeked']
    .forEach(ev => v.addEventListener(ev, paint));
  paint();

  // (播放/暂停统一由 togglePlay 处理)
  const paintVol = () => {
    const mb = $('#plMute');
    if (!mb) return;
    const lv = (v.muted || v.volume === 0) ? 0 : (v.volume < 0.34 ? 1 : (v.volume < 0.72 ? 2 : 3));
    mb.classList.remove('vol-mute', 'vol-low', 'vol-mid');
    if (lv === 0) mb.classList.add('vol-mute');
    else if (lv === 1) mb.classList.add('vol-low');
    else if (lv === 2) mb.classList.add('vol-mid');
    mb.title = lv === 0 ? '取消静音（M）' : ('音量 ' + Math.round(v.volume * 100) + '%（M 静音）');
  };
  v.addEventListener('volumechange', paintVol);
  setTimeout(paintVol, 0);

  if (muteB) muteB.onclick = () => {
    v.muted = !v.muted;
    muteB.style.opacity = v.muted ? '.45' : '.88';
  };
  if (volS) volS.oninput = () => { v.volume = +volS.value; v.muted = (+volS.value === 0); };

  // 进度拖动
  const seekTo = (clientX) => {
    const r = prog.getBoundingClientRect();
    let k = (clientX - r.left) / r.width;
    k = Math.max(0, Math.min(1, k));
    if (isFinite(v.duration)) v.currentTime = k * v.duration;
  };
  let dragging = false;
  if (prog){
    prog.addEventListener('mousedown', e => { dragging = true; seekTo(e.clientX); });
    window.addEventListener('mousemove', e => { if (dragging) seekTo(e.clientX); });
    window.addEventListener('mouseup', () => { dragging = false; });
    prog.addEventListener('touchstart', e => {
      if (e.touches[0]) seekTo(e.touches[0].clientX);
    }, {passive:true});
    prog.addEventListener('touchmove', e => {
      if (e.touches[0]) seekTo(e.touches[0].clientX);
    }, {passive:true});
  }

  // 全屏只让 <video> 进全屏，画面铺满、不留容器留白
  const _fsEl = () => (document.fullscreenElement || document.webkitFullscreenElement);
  // 全屏固定走"舞台容器"：video 全屏会丢掉字幕层和控件
  // 伪全屏兜底：API 被拒时，用 fixed 铺满视口达到同样观感
  let _pseudoFS = false;
  const _setPseudo = (on) => {
    _pseudoFS = on;
    wrap.classList.toggle('pseudo-fs', on);
    try {
      document.documentElement.classList.toggle('fs-on', on || !!_fsEl());
      document.body.classList.toggle('fs-on', on || !!_fsEl());
    } catch(e2){}
    try { document.body.style.overflow = on ? 'hidden' : ''; } catch(e){}
    if (fullB) fullB.innerHTML = on
      ? '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
      : '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  };

  const _enterFS = () => {
    const el = wrap;
    let fn = el.requestFullscreen || el.webkitRequestFullscreen
          || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (!fn){ _setPseudo(true); return; }
    let p;
    try { p = fn.call(el); } catch(e){ _setPseudo(true); return; }
    if (p && p.catch){
      p.catch(() => {
        // 被拒（无手势/策略限制）→ 立刻伪全屏，用户仍得到铺满效果
        _setPseudo(true);
      });
    }
  };
  const _exitFS = () => {
    if (_pseudoFS){ _setPseudo(false); return; }
    try {
      if (_fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } catch(e){}
  };
  if (fullB){
    const _fsToggle = (ev) => {
      if (ev){ ev.preventDefault(); ev.stopPropagation(); }
      if (typeof MPV !== 'undefined' && MPV.active){
    const on = !MPV.fullscreen;
    MPV.fullscreen = on;
    try { mpvCmd('fullscreen', on); } catch(e){}
    if (fullB) fullB.innerHTML = on
      ? '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
      : '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    return;
  }
  if (_fsEl() || _pseudoFS) _exitFS(); else _enterFS();
    };
    fullB.onclick = _fsToggle;
    // 捕获阶段先拦，避免被 stage 的点击逻辑吃掉
    fullB.addEventListener('click', _fsToggle, true);
    fullB.addEventListener('mousedown', (e) => e.stopPropagation(), true);
  }
  const _syncFsClass = () => {
    const on = !!_fsEl() || _pseudoFS;
    document.documentElement.classList.toggle('fs-on', on);
    try { document.body.classList.toggle('fs-on', on); } catch(e){}
  };
  document.addEventListener('fullscreenchange', _syncFsClass);
  document.addEventListener('webkitfullscreenchange', _syncFsClass);

  document.addEventListener('fullscreenchange', () => {
    _syncFsClass();
    if (fullB){
      fullB.innerHTML = _fsEl()
        ? '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
        : '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    }
  });

  if (pipB) pipB.onclick = () => {
    try {
      if (document.pictureInPictureElement) document.exitPictureInPicture();
      else if (v.requestPictureInPicture) v.requestPictureInPicture();
    } catch(e){}
  };

  // ---- 点画面播放/暂停（通用播放器逻辑）----
  const stage = $('#plStage');
  const flash = (icon) => {
    const f = $('#plFlash');
    if (!f) return;
    f.innerHTML = icon;
    f.classList.add('show');
    clearTimeout(f.__t);
    f.__t = setTimeout(() => f.classList.remove('show'), 420);
  };
  const SVG_PLAY = '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const SVG_PAUSE = '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

  const togglePlay = () => {
    if (v.paused){
      v.__userPaused = false;
      v.play().catch(()=>{});
      flash(SVG_PLAY);
    } else {
      v.__userPaused = true;
      v.pause();
      flash(SVG_PAUSE);
    }
    showUI();
  };

  if (stage){
    stage.addEventListener('click', (e) => {
      // 控制条/侧栏/面板/按钮内的点击一律不触发暂停
      if (e.target.closest('.pl-ctrl, .pl-side, .cc-panel, .ast-panel, .pl-top, button')) return;
      if (e.target === v || e.target.closest('.pl-body')) togglePlay();
    });
  }
  if (btn) btn.onclick = togglePlay;

  // 自动隐藏
  const showUI = () => {
    wrap.classList.remove('hideui');
    clearTimeout(_uiTimer);
    _uiTimer = setTimeout(() => {
      if (!v.paused) wrap.classList.add('hideui');
    }, 2800);
  };
  ['mousemove','mousedown','touchstart','keydown'].forEach(ev =>
    wrap.addEventListener(ev, showUI, {passive:true}));
  showUI();

  // 快捷键
  // ---- 快捷键（严格按需求：空格/左右10秒/上下1格音量）----
  const STEP_SEC = 10;      // 左右键步长（秒）
  const VOL_STEP = 0.1;     // 上下键音量步长（每格 10%）

  // 屏幕提示（不打断画面）
  const toast = (txt) => {
    let t = document.getElementById('plToast');
    if (!t){
      t = document.createElement('div');
      t.id = 'plToast';
      t.className = 'pl-toast';
      (wrap || document.body).appendChild(t);
    }
    t.textContent = txt;
    t.classList.add('show');
    clearTimeout(t.__t);
    t.__t = setTimeout(() => t.classList.remove('show'), 900);
  };

  const doSeek = (delta) => {
    const dur = v.duration || 0;
    let tgt = v.currentTime + delta;
    if (dur > 0) tgt = Math.min(dur - 0.15, Math.max(0, tgt));
    else tgt = Math.max(0, tgt);
    v.currentTime = tgt;
    const sign = delta > 0 ? '+' : '';
    toast((delta > 0 ? '快进 ' : '快退 ') + Math.abs(delta) + ' 秒');
    return tgt;
  };

  const doVolume = (delta) => {
    // 用整数档位算，避免 0.9+0.1=0.9999 卡在 0.9
    let step = Math.round((v.volume + delta) * 10);
    step = Math.max(0, Math.min(10, step));
    const nv = step / 10;
    v.volume = nv;
    if (nv > 0 && v.muted) v.muted = false;
    if (nv === 0) v.muted = true;
    toast('音量 ' + Math.round(nv * 100) + '%');
    try { paintVol(); } catch(err){}
    const slider = document.getElementById('plVol');
    if (slider) slider.value = nv;
    return nv;
  };

  const onKey = (e) => {
    const w = document.getElementById('plWrap');
    if (!w || !w.classList.contains('open')) return;
    const tag = ((e.target && e.target.tagName) || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.target && e.target.isContentEditable) return;
    // 有面板打开时，方向键用于面板导航，不劫持
    const panelOpen = document.querySelector('.cc-panel.open, .ast-panel.open');
    if (panelOpen && e.key !== 'Escape') return;

    switch (e.key){
      case ' ':
      case 'Spacebar':
        e.preventDefault(); e.stopPropagation();
        if (v.paused) { v.__userPaused = false; v.play().catch(()=>{}); }
        else { v.__userPaused = true; v.pause(); }
        break;
      case 'ArrowRight':
        e.preventDefault(); e.stopPropagation();
        doSeek(STEP_SEC);
        break;
      case 'ArrowLeft':
        e.preventDefault(); e.stopPropagation();
        doSeek(-STEP_SEC);
        break;
      case 'ArrowUp':
        e.preventDefault(); e.stopPropagation();
        doVolume(VOL_STEP);
        break;
      case 'ArrowDown':
        e.preventDefault(); e.stopPropagation();
        doVolume(-VOL_STEP);
        break;
      case 'Escape':
        if (_pseudoFS){ e.preventDefault(); _exitFS(); }
        break;
      case 'f': case 'F':
        if (_fsEl() || _pseudoFS) _exitFS(); else _enterFS();
        break;
      case 'm': case 'M':
        v.muted = !v.muted;
        toast(v.muted ? '已静音' : '已取消静音');
        break;
      case 'c': case 'C':
        try { ccTogglePanel(); } catch(err){}
        break;
      default:
        break;
    }
  };

  // 绑定（只绑一次）
  if (!window.__plKey){
    window.__plKey = true;
    document.addEventListener('keydown', onKey, true);
  } else {
    // 已绑过：替换处理器（重新打开播放器时刷新闭包里的 v）
    document.removeEventListener('keydown', window.__plKeyHandler, true);
  }
  window.__plKeyHandler = onKey;
  /* 旧绑定注释结束 */
}

const SUB_STATE = { tracks: [], cur: -1 };

const _ccFmt = sec => {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0')
       + ':' + x.toFixed(3).padStart(6, '0');
};

function jSrtToVtt(t){
  t = (t || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const out = ['WEBVTT', ''];
  t.split(/\n{2,}/).forEach(block => {
    const lines = block.split('\n').filter(x => x.trim());
    if (!lines.length) return;
    const ti = lines.findIndex(l => l.indexOf('-->') >= 0);
    if (ti < 0) return;
    const m = lines[ti].match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);
    if (!m) return;
    const a = (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000;
    const b = (+m[5]) * 3600 + (+m[6]) * 60 + (+m[7]) + (+m[8]) / 1000;
    out.push(_ccFmt(a) + ' --> ' + _ccFmt(b));
    out.push(...lines.slice(ti + 1).map(l => l.replace(/<\/?[^>]+>/g, '')));
    out.push('');
  });
  return out.join('\n');
}

function jAssToVtt(t){
  t = (t || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const out = ['WEBVTT', ''];
  const parse = x => {
    const m = (x || '').trim().match(/(\d+):(\d+):(\d+(?:\.\d+)?)/);
    return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : null;
  };
  t.split('\n').forEach(line => {
    const L = line.trim();
    if (L.toLowerCase().indexOf('dialogue:') !== 0) return;
    const p = L.slice(L.indexOf(':') + 1).split(',');
    if (p.length < 4) return;
    const a = parse(p[1]), b = parse(p[2]);
    if (a === null || b === null) return;
    let txt = p.slice(9).join(',');
    txt = txt.replace(/\{[^}]*\}/g, '').replace(/\\N|\\n/g, '\n').trim();
    if (!txt) return;
    out.push(_ccFmt(a) + ' --> ' + _ccFmt(b));
    out.push(...txt.split('\n'));
    out.push('');
  });
  return out.join('\n');
}

function jToVtt(text, name){
  const n = (name || '').toLowerCase();
  if (n.endsWith('.ass') || n.endsWith('.ssa')) return jAssToVtt(text);
  if (n.endsWith('.vtt')) return /^WEBVTT/.test(text.trim()) ? text : 'WEBVTT\n\n' + text;
  return jSrtToVtt(text);
}

const AST = { open: false, tracks: [], cur: 0, fid: '', aac: null, timer: null };

function astLabel(t){

                kor:'韩语',hin:'印地语',spa:'西语',fre:'法语',ger:'德语',

function astBad(codec){

  if (/EAC3|AC3|DTS|TRUEHD/.test(c)) return { bad: true, label: '杜比·无声音' };
  if (/AAC|MP3|OPUS|FLAC|PCM/.test(c)) return { bad: false, label: '可播放' };

async function astLoad(fid){
  AST.fid = fid || '';

  AST.cur = 0;
  if (!fid) { astRender(); return; }
  try {
    const j = await (await fetch('/api/subtitle/tracks?fid=' + encodeURIComponent(fid))).json();
    if (j && j.ok && j.data && j.data.tracks){
      AST.tracks = j.data.tracks;
    }
  } catch(e){}
  // 音频轨（MKV 探测只回字幕，音轨走 resolve 时的 audio_info）
  astRender();
}

function astRender(){
  const p = $('#astPanel');
  if (!p) return;
  const rows = [];

  // ---- 音轨 ----
  rows.push('<div class="ast-head">音轨</div>');

    + `<span class="ast-tag">${AST.aac && AST.aac.ready ? '就绪' : '兼容'}</span></button>`);

  // ---- 字幕 ----
  rows.push('<div class="ast-head">字幕</div>');
  rows.push(`<button class="ast-item ${SUB_STATE.cur===-1?'on':''}" data-ast="s-1">关闭</button>`);
  SUB_STATE.tracks.forEach((t, i) => {
    const tag = t.type === 'local' ? '本地' : (t.type === 'online' ? '在线' : (t.type === 'emb' ? '内嵌' : '内置'));
    rows.push(`<button class="ast-item ${SUB_STATE.cur===i?'on':''}" data-ast="s${i}">`
      + `${esc(t.label)}<span class="ast-tag">${tag}</span></button>`);
  });

  // ---- 内嵌字幕（未提取的） ----
  const emb = (typeof EMB !== 'undefined' && EMB.tracks) ? EMB.tracks : [];
  if (emb.length){
    rows.push('<div class="ast-head">内嵌字幕（需提取）</div>');
    emb.forEach(t => {
      const on = SUB_STATE.tracks.some(x => x.key === ('emb' + t.number));
      const bad = t.kind !== 'text';
      rows.push(`<button class="ast-item ${on?'on':''}" data-ast="e${t.number}" ${bad?'disabled':''}>`
        + `${esc(astLabel(t))}<span class="ast-tag">${bad ? '图片字幕' : '提取'}</span></button>`);
    });
  }

  rows.push('<div class="ast-note">杜比音轨（EAC3/AC3/DTS）Chrome 播不了，切到「AAC 立体声」即可，画面不动。</div>');
  p.innerHTML = rows.join('');

  p.querySelectorAll('[data-ast]').forEach(b => {
    b.onclick = () => astPick(b.dataset.ast);
  });
}

function astToggle(){
  const p = $('#astPanel');
  if (!p) return;

  AST.open = willOpen;

async function astPick(key){
  if (!key) return;
  if (key === 'a0'){
    AST.cur = 0;
    astUseOriginal();
  } else if (key === 'a1'){
    AST.cur = 1;
    await astUseAAC();
  } else if (key.startsWith('s')){
    const i = parseInt(key.slice(1), 10);
    ccPick(i);
  } else if (key.startsWith('e')){
    const n = parseInt(key.slice(1), 10);
    try { embStart(n); } catch(e){}
  }
  astRender();
}

function astUseOriginal(){
  const v = $('#plVideo');
  if (!v) return;
  try { v.muted = _plMutedBeforeAAC || false; } catch(e){}
  const a = document.querySelector('#auxAudio');
  if (a){ try { a.pause(); } catch(e){} a.remove(); }
  _plAudioMode = 'orig';
}

let _plMutedBeforeAAC = false;
let _plAudioMode = 'orig';

async function astUseAAC(){
  const v = $('#plVideo');
  if (!v || !AST.fid) return;
  // 已经有就直接用
  if (AST.aac && AST.aac.ready){
    astAttachAAC(AST.aac.url);
    return;
  }
  // 视频必须静音，否则会同时出两个声音
  _plMutedBeforeAAC = v.muted;
  v.muted = true;

  const paint = (txt) => {
    const el = document.querySelector('[data-ast="a1"] .ast-tag');
    if (el) el.textContent = txt;
  };
  paint('准备中…');

  const ask = async () => {
    const r = await fetch('/api/audio/aac?fid=' + encodeURIComponent(AST.fid) + '&start=0');
    return (await r.json()).data || {};
  };

  try {
    let d = await ask();
    if (d.ready){
      AST.aac = d;
      astAttachAAC(d.url);
      paint('就绪');
      return;
    }
    // 轮询转码进度
    let n = 0;
    clearInterval(AST.timer);
    AST.timer = setInterval(async () => {
      n++;
      if (n > 240){ clearInterval(AST.timer); paint('超时'); return; }
      try {
        const d2 = await ask();
        if (d2.ready){
          clearInterval(AST.timer);
          AST.aac = d2;
          astAttachAAC(d2.url);
          const el = document.querySelector('[data-ast="a1"] .ast-tag');
          if (el) el.textContent = '就绪';
        } else if (d2.size){
          const el = document.querySelector('[data-ast="a1"] .ast-tag');
          if (el) el.textContent = '转码中 ' + Math.round(d2.size / 1024) + 'KB';
        }
      } catch(e){}
    }, 1500);
  } catch(e){ paint('失败'); }
}

function astAttachAAC(url){
  const v = $('#plVideo');
  if (!v) return;
  let a = document.querySelector('#auxAudio');
  if (!a){
    a = document.createElement('audio');
    a.id = 'auxAudio';
    a.style.display = 'none';
    document.body.appendChild(a);
  }
  a.src = url;
  a.currentTime = v.currentTime || 0;
  a.volume = v.volume;
  a.play().catch(()=>{});
  _plAudioMode = 'aac';
  // 跟随视频暂停/播放/拖动
  if (!a.dataset.hooked){
    a.dataset.hooked = '1';
    v.addEventListener('play', () => { if (_plAudioMode==='aac'){ a.currentTime = v.currentTime; a.play().catch(()=>{}); } });
    v.addEventListener('pause', () => { try { a.pause(); } catch(e){} });
    v.addEventListener('seeked', () => { if (_plAudioMode==='aac') a.currentTime = v.currentTime; });
    v.addEventListener('volumechange', () => { a.volume = v.volume; });
  }
}

function buildCcPanel(){
  const panel = $('#ccPanel');
  if (!panel) return;
  const rows = ['<div class="cc-head">字幕</div>',
    `<button class="cc-item ${SUB_STATE.cur === -1 ? 'on' : ''}" data-cc="-1">关闭</button>`];
  SUB_STATE.tracks.forEach((t, i) => {
    const tag = t.type === 'local' ? '<span class="cc-tag">本地</span>' : '';
    rows.push(`<button class="cc-item ${SUB_STATE.cur === i ? 'on' : ''}" data-cc="${i}">`
      + `${esc(t.label)}${tag}</button>`);
  });
  rows.push('<button class="cc-item" data-cc="file">＋ 选择本地字幕…</button>');
  const onl = (typeof onlSectionHtml === 'function') ? onlSectionHtml() : '';
  const emb = (typeof embSectionHtml === 'function') ? embSectionHtml() : '';
  panel.innerHTML = rows.join('') + onl + emb;
  panel.querySelectorAll('[data-cc]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.cc;
      if (k === 'file'){ const f = $('#ccFile'); if (f) f.click(); return; }
      ccPick(Number(k));
    };
  });
  panel.querySelectorAll('[data-emb]').forEach(b => {
    b.onclick = () => embStart(Number(b.dataset.emb));
  });
  panel.querySelectorAll('[data-onl]').forEach(b => {
    b.onclick = () => {
      const it = ONL.items.find(x => String(x.id) === String(b.dataset.onl));
      if (it) onlAttach(it);
    };
  });
}

function ccPick(i){
  const v = $('#plVideo');
  if (!v) return;
  SUB_STATE.cur = i;
  SUB_STATE.tracks.forEach((t, k) => {
    const on = (k === i);
    // 注意：HTMLTrackElement 没有 mode，真正的 TextTrack 在 el.track 上
    const setMode = () => {
      try {
        const tt = t.el.track || (t.el.track = null);
        if (tt) tt.mode = on ? 'showing' : 'disabled';
      } catch(e){}
    };
    setMode();
    if (on && !t.el.__ccHook){
      t.el.__ccHook = true;
      t.el.addEventListener('load', () => {
        if (SUB_STATE.cur === k){
          try { if (t.el.track) t.el.track.mode = 'showing'; } catch(e){}
        }
      });
    }
  });
  const btn = $('#plCC');
  if (btn) btn.classList.toggle('on', i >= 0);
  const panel = $('#ccPanel');
  if (panel) panel.querySelectorAll('[data-cc]').forEach(b => {
    b.classList.toggle('on', String(b.dataset.cc) === String(i));
  });
}

function ccTogglePanel(){
  const p = $('#ccPanel');
  if (!p) return;
  const open = !p.classList.contains('open');
  p.classList.toggle('open', open);
  if (open) buildCcPanel();
}

function ccClosePanel(){
  const p = $('#ccPanel');
  if (p) p.classList.remove('open');
}

function ccLoadLocal(file){
  if (!file) return;
  const v = $('#plVideo');
  if (!v) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const vtt = jToVtt(String(rd.result || ''), file.name);
      if (!/^WEBVTT/.test(vtt.trim())){ alert('这个字幕文件解析不出内容'); return; }
      const url = URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
      SUB_STATE.tracks = SUB_STATE.tracks.filter(t => t.type !== 'local');
      const label = file.name.replace(/\.[a-z0-9]{2,4}$/i, '');
      const tr = ccAttach(v, url, label, 'local');
      SUB_STATE.tracks.push({ type: 'local', label, src: url, el: tr });
      buildCcPanel();
      setTimeout(() => ccPick(SUB_STATE.tracks.length - 1), 60);
    } catch(e){ alert('字幕加载失败：' + e.message); }
  };
  rd.readAsText(file);
}

/* ---------- 内嵌字幕 ---------- */
const EMB = { fid: '', tracks: [], timers: {} };

async function loadEmbeddedSubs(fid){
  EMB.fid = fid || '';
  EMB.tracks = [];
  if (!fid || !d_has_video()) return;
  try {
    const j = await (await fetch('/api/subtitle/tracks?fid=' + encodeURIComponent(fid))).json();
    if (j && j.ok && j.data && j.data.tracks){
      EMB.tracks = j.data.tracks.filter(t => t.kind === 'text');
    }
  } catch(e){ EMB.tracks = []; }
  buildCcPanel();
}

function d_has_video(){

function embLabel(t){
  const n = (t.name || '').trim();
  const lang = { chi: '中文', zho: '中文', eng: '英语', jpn: '日语', kor: '韩语',
                 spa: '西语', fre: '法语', ger: '德语', hin: '印地语', ind: '印尼语' }[t.lang] || '';
  return n ? n : (lang || ('字幕 ' + t.number));
}

function embStart(track){
  const fid = EMB.fid;
  if (!fid) return;
  const key = String(track);
  const el = document.querySelector('[data-emb="' + key + '"]');
  if (el) el.classList.add('on');

  const paint = (d) => {
    const e2 = document.querySelector('[data-emb="' + key + '"]');
    const tag = e2 ? e2.querySelector('.cc-tag') : null;
    if (d.state === 'done'){
      if (tag) tag.textContent = '已就绪';
      embAttach(fid, track, true);
      return true;
    }
    if (d.state === 'failed'){
      if (tag) tag.textContent = '失败';
      return true;
    }
    // 抽取中断（比如服务重启）：有残留字幕就提示可继续，别显示成 0% 像卡死
    if (d.state === 'partial' && (d.cues || 0) > 0){
      if (tag) tag.textContent = '已有 ' + d.cues + ' 条·点继续';
      return true;
    }
    // 抽取中：先把轨道挂上（可能还没有 cue），之后每 15 秒刷新一次
    if (tag) tag.textContent = (d.percent || 0) + '%' + ((d.cues || 0) > 0 ? (' · ' + d.cues + ' 条') : '');
    const now = Date.now();
    if (!EMB.lastBust || now - EMB.lastBust > 15000){
      EMB.lastBust = now;
      embAttach(fid, track, true);
    }
    return false;
  };

  fetch('/api/subtitle/extract?fid=' + encodeURIComponent(fid) + '&track=' + key)
    .then(r => r.json())
    .then(j => {
      const st = (j && j.data) ? j.data : { state: 'running', percent: 0 };
      if (paint(st)) return;
      if (EMB.timers[key]) clearInterval(EMB.timers[key]);
      EMB.timers[key] = setInterval(async () => {
        try {
          const r2 = await (await fetch('/api/subtitle/status?fid=' + encodeURIComponent(fid)
            + '&track=' + key)).json();
          const d = (r2 && r2.data) ? r2.data : {};
          if (paint(d)){
            clearInterval(EMB.timers[key]);
            delete EMB.timers[key];
          }
        } catch(e){}
      }, 3000);
    })
    .catch(() => {});
}

function embAttach(fid, track, bust){
  const v = document.querySelector('#plVideo');
  if (!v) return;
  const key = 'emb' + track;
  const src = '/api/subtitle/vtt?fid=' + encodeURIComponent(fid) + '&track=' + track
            + (bust ? ('&t=' + Date.now()) : '');
  // 已经挂过：只换 src 让它重新加载（抽取过程中会不断变长）
  const exist = SUB_STATE.tracks.find(t => t.key === key);
  if (exist) {
    try { exist.el.src = src; } catch(e){}
    try { if (exist.el.track) exist.el.track.mode = 'showing'; } catch(e){}
    SUB_STATE.cur = SUB_STATE.tracks.indexOf(exist);
    return;
  }
  const t = EMB.tracks.find(x => String(x.number) === String(track));
  const label = t ? embLabel(t) : ('内嵌 ' + track);
  const el = ccAttach(v, src, label, 'emb');
  SUB_STATE.tracks.push({ type: 'emb', key, label, src, el });
  // 挂上新轨并选中
  setTimeout(() => {
    const i = SUB_STATE.tracks.length - 1;
    SUB_STATE.cur = i;
    SUB_STATE.tracks.forEach((x, k) => {
      try { if (x.el.track) x.el.track.mode = (k === i) ? 'showing' : 'disabled'; } catch(e){}
    });
    buildCcPanel();
    const btn = $('#plCC');
    if (btn) btn.classList.add('on');
  }, 60);
}

function embSectionHtml(){
  if (!EMB.tracks.length) return '';
  const rows = EMB.tracks.map(t => {
    const on = SUB_STATE.tracks.some(x => x.key === ('emb' + t.number));
    return `<button class="cc-item ${on ? 'on' : ''}" data-emb="${t.number}">`
      + `${esc(embLabel(t))}<span class="cc-tag">${on ? '已就绪' : '内嵌'}</span></button>`;

  return `<div class="cc-head" style="padding-top:10px">内嵌字幕（需提取）</div>` + rows;
}


/* ---------- 在线字幕（秒出） ---------- */
const ONL = { items: [], busy: false, tried: '' };

function onlNorm(t){
  return String(t || '').toLowerCase()
    .replace(/[\.\-_\[\]\(\)：:，,。、·]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function onlTokens(t){
  const stop = new Set(['the','of','and','a','in','to','for','1080p','2160p','720p',
    'bluray','web','webdl','hdtv','x264','x265','h264','hevc','aac','ddp','remux','imax']);
  return onlNorm(t).split(' ').filter(x => x.length > 1 && !stop.has(x) && !/^\d+$/.test(x));
}

function onlScore(item, fname, year, title){
  const it = onlNorm(item.title);
  const fn = onlNorm(fname);
  if (!it) return 0;
  let s = 0;
  const toks = onlTokens(it);
  if (fn) for (const t of toks){ if (fn.indexOf(t) >= 0) s += 3; }

  // 片名本身出现在字幕标题里（去掉空格比较，中文更可靠）
  const t0 = onlNorm(title || '').replace(/ /g, '');
  if (t0 && it.replace(/ /g, '').indexOf(t0) >= 0) s += 6;

  // 年份：同年的强加分，不同年直接扣分（2026 的同名片不能给 2019 用）
  const iy = (item.title.match(/(19|20)\d{2}/) || [])[0];
  const fy = String(year || '');
  if (iy && fy){
    if (String(iy) === fy) s += 12;
    else s -= 10;
  }

  // 季集号
  const ep = (fn.match(/s(\d{1,2})e(\d{1,2})/) || []);
  if (ep.length){
    const tag = 's' + ep[1] + 'e' + ep[2];
    if (it.indexOf(tag) >= 0) s += 8;
  }
  if (item.langs && (/简|双语/.test(item.langs))) s += 2;
  return s;
}

async function loadOnlineSubs(title, year, fname){
  const t = (title || '').trim();
  if (!t || ONL.busy) return;
  if (ONL.tried === t) { buildCcPanel(); return; }
  ONL.tried = t;
  ONL.busy = true;
  buildCcPanel();
  try {
    const q = '/api/subtitle/online?title=' + encodeURIComponent(t)
            + (year ? ('&year=' + encodeURIComponent(year)) : '');
    const j = await (await fetch(q)).json();
    ONL.items = (j && j.data && j.data.items) ? j.data.items : [];
  } catch(e){ ONL.items = []; }
  ONL.busy = false;
  buildCcPanel();
  // 自动挑一条最匹配的挂上
  try { onlAutoPick(fname, year, t); } catch(e){}
}

function onlAutoPick(fname, year, title){
  if (!ONL.items.length) return;
  const scored = ONL.items
    .map(it => ({ it, s: onlScore(it, fname, year, title) }))
    .sort((a, b) => b.s - a.s);
  const best = scored[0];
  if (!best || best.s < 8) return;          // 匹配太弱就不要自动挂
  onlAttach(best.it);
}

function onlAttach(item){
  const v = document.querySelector('#plVideo');
  if (!v || !item || !item.detail) return;
  const key = 'onl' + item.id;
  const src = '/api/subtitle/online/vtt?url=' + encodeURIComponent(item.detail)
            + '&t=' + Date.now();

    SUB_STATE.cur = SUB_STATE.tracks.indexOf(exist);
    buildCcPanel();
    return;
  }
  const el = ccAttach(v, src, label, 'onl');
  SUB_STATE.tracks.push({ type: 'onl', key, label, src, el });
  setTimeout(() => {
    const i = SUB_STATE.tracks.length - 1;
    SUB_STATE.cur = i;
    SUB_STATE.tracks.forEach((x, k) => {
      try { if (x.el.track) x.el.track.mode = (k === i) ? 'showing' : 'disabled'; } catch(e){}
    });

    if (btn) btn.classList.add('on');
    buildCcPanel();

}

function onlSectionHtml(){
  if (ONL.busy){
    return `<div class="cc-head" style="padding-top:10px">在线字幕</div>`
         + `<button class="cc-item" disabled>正在搜索字幕…</button>`;
  }

}

let _plCtx = { url: '', pwd: '', title: '' };

let _audCardShown = false;

/* 播放后实测音频解码：解出字节 > 0 说明有声音，连续 3 秒为 0 才提示 */
let _audWatchTimer = null;
function watchAudioDecoded(v, label){
  if (!v || !v.addEventListener) return;
  clearInterval(_audWatchTimer);
  let silentTicks = 0;
  let checked = false;

  const probe = () => {
    if (!v || !document.body.contains(v)) { clearInterval(_audWatchTimer); return; }
    if (v.paused || v.readyState < 2) return;      // 没在播就先不判
    const bytes = (typeof v.webkitAudioDecodedByteCount === 'number')
                ? v.webkitAudioDecodedByteCount : -1;
    if (bytes === -1){ clearInterval(_audWatchTimer); return; } // 不支持检测，别乱报
    if (bytes > 0){
      clearInterval(_audWatchTimer);
      _audCardShown = false;
      const c = document.querySelector('.aud-card');
      if (c) c.remove();
      return;
    }
    silentTicks++;
    // 已经解出过音频的不再判；连续 ~3 秒(6 次*500ms)仍是 0 才提示
    if (silentTicks >= 6 && !checked){
      checked = true;
      clearInterval(_audWatchTimer);
      showAudioWarn(label || '当前音轨');
    }
  };

  v.addEventListener('playing', () => { silentTicks = 0; checked = false; }, {passive:true});
  _audWatchTimer = setInterval(probe, 500);
  setTimeout(probe, 1200);
}

function showAudioWarn(label){
  if (_audCardShown) return;
  _audCardShown = true;
  const old = document.querySelector('.aud-card');
  if (old) old.remove();
  const w = document.createElement('div');
  w.className = 'aud-card';
  w.innerHTML = '<button class="ac-close" title="关闭">×</button>'
    + '<div class="ac-title"><i>!</i>当前音轨没有声音</div>'
    + '<div class="ac-body">这条片源是 <b>' + esc(label || '杜比音轨') + '</b>，'
    + 'Chrome 没有 Dolby 授权，播不出声。可以切到 AAC 音轨，画面不动。</div>'
    + '<div class="ac-acts">'
    + '<button class="ac-btn ac-fix">切换到 AAC 音轨</button>'
    + '<button class="ac-btn ac-later">先这样看</button>'
    + '</div>';
  document.body.appendChild(w);
  w.querySelector('.ac-close').onclick = () => { w.remove(); _audCardShown = false; };
  w.querySelector('.ac-later').onclick = () => { w.remove(); _audCardShown = false; };
  w.querySelector('.ac-fix').onclick = () => {
    w.remove(); _audCardShown = false;
    try { AST.cur = 1; astPick('a1'); } catch(e){}
    // 顺带打开音轨面板让人看到进度
    try { const p = $('#astPanel'); if (p && !p.classList.contains('open')) astToggle(); } catch(e){}
  };
}

function renderEpisodes(d, url, pwd, title){
  const box = $('#plEps');
  if (!box) return;
  const eps = d.episodes || [];
  if (eps.length <= 1){
    box.innerHTML = '';

  }

    const label = e.ep ? ('第 ' + e.ep + ' 集') : (e.name || '').replace(/\.[a-z0-9]{2,4}$/i, '').slice(0, 12);
    const gb = e.size ? (e.size / 1073741824) : 0;
    const q = gb >= 1 ? (gb.toFixed(1) + 'G') : (e.size ? Math.round(e.size / 1048576) + 'M' : '');
    return `<button class="pe-btn${e.i === cur ? ' on' : ''}" data-ep="${e.i}">`

  if (on){
    try { on.scrollIntoView({block: 'nearest'}); } catch(e){}
  }
}


/* ══════ 杜比音轨 → 自动启用 AAC 流 ══════ */
let _aacAudio = null, _aacBase = 0, _aacTimer = null, _aacFid = '';

function _aacBadge(txt){
  try {
    let b = document.getElementById('aacBadge');
    if (!b){
      b = document.createElement('span');
      b.id = 'aacBadge';
      b.className = 'aac-badge';
      const row = document.querySelector('#plCtrl .pl-row');
      if (row) row.insertBefore(b, row.children[2] || null);
      else return;
    }
    b.textContent = txt;
    b.style.display = txt ? '' : 'none';
  } catch(e){}
}

function stopLiveAAC(){
  clearInterval(_aacTimer); _aacTimer = null;
  if (_aacAudio){
    try { _aacAudio.pause(); } catch(e){}
    try { _aacAudio.src = ''; } catch(e){}
    _aacAudio = null;
  }
  _aacBadge('');
}

function startLiveAAC(v, fid){
  if (!v || !fid) return;
  stopLiveAAC();
  _aacFid = fid;
  _aacBadge('正在准备声音…');

  const a = new Audio();
  a.preload = 'auto';
  a.volume = v.volume;
  _aacAudio = a;
  try { window._aacAudio = a; } catch(e){}
  _aacBase = 0;
  a.src = '/api/audio/live/file?fid=' + encodeURIComponent(fid) + '&start=0&t=' + Date.now();

  v.muted = true;                      // 画面静音，声音走 AAC

  a.addEventListener('playing', () => {
    _aacBadge('AAC 音轨');
    const want = v.currentTime - _aacBase;
    if (isFinite(want) && Math.abs(a.currentTime - want) > 2){
      try { a.currentTime = Math.max(0, want); } catch(e){}
    }
  }, { once: false });

  let _waitTimer = null;
  a.addEventListener('waiting', () => {
    clearTimeout(_waitTimer);
    _waitTimer = setTimeout(() => { if (_aacAudio && _aacAudio.readyState < 3) _aacBadge('缓冲声音…'); }, 1000);
  });
  a.addEventListener('canplay', () => { clearTimeout(_waitTimer); _aacBadge('AAC 音轨'); });

  // 先缓冲够 8 秒再开播，避免一顿一顿
  let _started = false;
  const tryStart = () => {
    if (_started || !_aacAudio) return;
    let ahead = 0;
    try {
      const b = a.buffered;
      if (b.length){
        for (let i = 0; i < b.length; i++){
          if (b.start(i) <= a.currentTime + 0.5 && b.end(i) >= a.currentTime){
            ahead = b.end(i) - a.currentTime;
            break;
          }
        }
        if (!ahead) ahead = b.end(b.length - 1) - a.currentTime;
      }
    } catch(e){}
    if (ahead >= 15){
      _started = true;
      clearInterval(_bufTimer);
      try { a.currentTime = Math.max(0, v.currentTime - _aacBase); } catch(e){}
      a.play().catch(()=>{});
      _aacBadge('AAC 音轨');
    } else {
      _aacBadge('准备声音 ' + Math.min(99, Math.round(ahead / 15 * 100)) + '%');
    }
  };
  const _bufTimer = setInterval(tryStart, 400);
  a.addEventListener('canplaythrough', () => { setTimeout(tryStart, 800); });
  try { a.load(); } catch(e){}

  // 音画同步（每 2 秒纠偏）
  clearInterval(_aacTimer);
  _aacTimer = setInterval(() => {
    if (!_aacAudio || !v) return;
    if (v.paused) { try { _aacAudio.pause(); } catch(e){} return; }
    const want = v.currentTime - _aacBase;
    const diff = Math.abs(_aacAudio.currentTime - want);
    if (diff > 0.6 && isFinite(want) && want >= 0){
      try { _aacAudio.currentTime = want; } catch(e){}
    }
    if (_aacAudio.paused){
      try { _aacAudio.play().catch(()=>{}); } catch(e){}
    }
    if (_aacAudio.muted !== v.muted){ _aacAudio.muted = v.muted; }
  }, 2000);

  // 视频播放/暂停联动
  v.addEventListener('play', () => { try { _aacAudio && _aacAudio.play().catch(()=>{}); } catch(e){} });
  v.addEventListener('pause', () => { try { _aacAudio && _aacAudio.pause(); } catch(e){} });
  v.addEventListener('volumechange', () => {
    try {
      if (_aacAudio){
        _aacAudio.volume = v.volume;
        _aacAudio.muted = v.muted;      // 静音按钮作用在声音轨上
      }
    } catch(e){}
  });

  // 拖动进度条 → 从新位置重新转码（带重试，旧音频等新的就绪再停）
  let seekTimer = null;
  const restartAt = (at, attempt, oldAudio) => {
    if (!_aacFid) return;
    const na = new Audio();
    na.preload = 'auto';
    na.volume = v.volume;
    na.muted = v.muted;
    _aacBadge('换音轨 ' + Math.round(attempt ? 60 : 30) + '%');
    let settled = false;

    const fail = () => {
      if (settled) return;
      settled = true;
      if (attempt < 3){
        // 往前退 4 秒重试（可能是区间还没转出来）
        restartAt(Math.max(0, at - 4), attempt + 1, oldAudio);
      } else {
        _aacBadge('换轨失败');
        try { if (oldAudio && !oldAudio.paused) return; } catch(e){}
        try { if (oldAudio){ oldAudio.play().catch(()=>{}); } } catch(e){}
      }
    };

    na.addEventListener('error', fail);
    na.addEventListener('stalled', () => setTimeout(() => { if (!settled && na.readyState < 2) fail(); }, 4000));
    na.addEventListener('playing', () => {
      if (settled) return;
      settled = true;
      _aacAudio = na;
      try { window._aacAudio = na; } catch(e){}
      _aacBase = at;
      _aacBadge('AAC 音轨');
      try { na.currentTime = Math.max(0, v.currentTime - _aacBase); } catch(e){}
      if (oldAudio){ try { oldAudio.pause(); oldAudio.src = ''; } catch(e){} }
    });

    na.src = '/api/audio/live/file?fid=' + encodeURIComponent(_aacFid) + '&start=' + at + '&t=' + Date.now();

    // 拖动后同样要先缓冲，避免一路饿死
    const _buf = setInterval(() => {
      if (settled) { clearInterval(_buf); return; }
      let ahead = 0;
      try {
        const b = na.buffered;
        if (b.length) ahead = b.end(b.length - 1) - na.currentTime;
      } catch(e){}
      if (ahead >= 10){
        clearInterval(_buf);
        _aacBadge('AAC 音轨');
        na.play().catch(() => {});
      } else {
        _aacBadge(ahead > 0
          ? ('准备声音 ' + Math.min(99, Math.round(ahead / 10 * 100)) + '%')
          : '正在定位音轨…');
      }
    }, 500);
    setTimeout(() => { clearInterval(_buf); if (!settled && na.readyState < 2) fail(); }, 150000);
  };

  v.addEventListener('seeked', () => {
    clearTimeout(seekTimer);
    seekTimer = setTimeout(() => {
      const at = Math.max(0, Math.floor(v.currentTime));
      const old = _aacAudio;
      try { if (old) old.pause(); } catch(e){}
      restartAt(at, 0, old);
    }, 400);
  });
}
