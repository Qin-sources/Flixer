/* ══════ mpv 遥控（B 方案）══════ */
const MPV = { active: false, fid: '', title: '', time: 0, duration: 0,
              paused: false, volume: 1, muted: false, fullscreen: false,
              timer: null, v: null };

async function mpvCmd(name, value){
  try {
    const q = new URLSearchParams({ name: name });
    if (value !== undefined && value !== null) q.set('value', String(value));
    const r = await fetch('/api/mpv/cmd?' + q.toString(), { method: 'POST' });
    const j = await r.json();
    return j && j.ok;
  } catch(e){ return false; }
}

function _mpvRect(v){
  // 依次尝试：画面容器 → 视频元素 → 舞台
  // （起播瞬间 video 还没有内在尺寸，高度可能是 0）
  const pick = [];
  try { pick.push(document.querySelector('.pl-body')); } catch(e){}
  if (v) pick.push(v);
  try { pick.push(document.querySelector('.pl-stage')); } catch(e){}
  const chromeH = (window.outerHeight - window.innerHeight) || 0;
  for (const el of pick){
    if (!el) continue;
    let r;
    try { r = el.getBoundingClientRect(); } catch(e){ continue; }
    if (r.width < 320 || r.height < 200) continue;
    // mpv 已关闭 hidpi 缩放（--hidpi-window-scale=no），直接给 CSS 像素即可
    return {
      x: Math.round(window.screenX + r.left),
      y: Math.round(window.screenY + chromeH + r.top),
      w: Math.round(r.width),
      h: Math.round(r.height)
    };
  }
  return null;
}

function mpvInstallProxy(v){
  const def = (name, get, set) => {
    try { Object.defineProperty(v, name, { configurable: true, enumerable: true, get: get, set: set }); }
    catch(e){}
  };
  def('currentTime', () => MPV.time, (x) => {
    const t = Math.max(0, Number(x) || 0);
    MPV.time = t;
    mpvCmd('seek', t);
  });
  def('duration', () => MPV.duration);
  def('paused', () => MPV.paused);
  def('volume', () => MPV.volume, (x) => {
    const val = Math.max(0, Math.min(1, Number(x) || 0));
    MPV.volume = val;
    mpvCmd('volume', val * 100);
  });
  def('muted', () => MPV.muted, (x) => {
    MPV.muted = !!x;
    mpvCmd('mute', !!x);
  });
  def('buffered', () => ({ length: 0 }));
  v.play = () => { MPV.paused = false; mpvCmd('pause', false); return Promise.resolve(); };
  v.pause = () => { MPV.paused = true; mpvCmd('pause', true); };
}

async function mpvPoll(){
  if (!MPV.active) return;
  try {
    const j = await (await fetch('/api/mpv/status')).json();
    const d = (j && j.data) || {};
    if (!d.running){
      MPV.time = 0;
      return;
    }
    MPV.time = Number(d.time) || 0;
    MPV.duration = Number(d.duration) || 0;
    MPV.paused = !!d.pause;
    MPV.volume = Math.max(0, Math.min(1, (Number(d.volume) || 0) / 100));
    MPV.muted = !!d.mute;
    MPV.fullscreen = !!d.fullscreen;
    if (!MPV.duration && MPV.fid && !MPV._reloadTried){
      MPV._reloadTried = true;
      try {
        const vr = _mpvRect(MPV.v);
        if (vr){
          const q = new URLSearchParams({ fid: MPV.fid, title: MPV.title || '',
            x: vr.x, y: vr.y, w: vr.w, h: vr.h });
          fetch('/api/mpv/play?' + q.toString(), { method: 'POST' }).catch(()=>{});
        }
      } catch(e){}
    }
    // 让现有 UI 重绘（paint 绑在 video 事件上，这里手动触发一次）
    try { MPV.v && MPV.v.dispatchEvent(new Event('timeupdate')); } catch(e){}
  } catch(e){}
}

async function mpvStart(v, d, title){
  if (!v || !d || !d.fid) return false;
  window._mpvBusy = true;   // 同步标记：防止别的路径再起一个播放器

  let rect = _mpvRect(v);
  if (!rect){
    for (let i = 0; i < 10 && !rect; i++){
      await new Promise(res => setTimeout(res, 150));
      rect = _mpvRect(v);
    }
  }
  if (!rect) return false;
  const q = new URLSearchParams({
    fid: d.fid, title: title || d.name || '',
    x: rect.x, y: rect.y, w: rect.w, h: rect.h
  });
  try {
    const r = await fetch('/api/mpv/play?' + q.toString(), { method: 'POST' });
    const j = await r.json();
    if (!j || !j.ok) return false;
  } catch(e){ window._mpvBusy = false; return false; }

  MPV.active = true;
  MPV.v = v;
  MPV.fid = d.fid;
  MPV.title = title || '';
  MPV.time = 0;
  MPV.duration = Number(d.duration_sec) || 0;
  MPV.paused = false;
  MPV.volume = 1;
  MPV.muted = false;

  try { v.removeAttribute('src'); v.load(); } catch(e){}
  mpvInstallProxy(v);

  clearInterval(MPV.timer);
  MPV.timer = setInterval(mpvPoll, 1000);
  setTimeout(mpvPoll, 300);

  // 装完代理后确保真的在播（页面里的自动播放逻辑可能把它按停了）
  setTimeout(() => {
    try {
      if (!MPV.active) return;
      if (MPV.time <= 0.05) mpvCmd('pause', false);
    } catch(e){}
  }, 1200);
  return true;
}

async function mpvStop(){
  if (!MPV.active) return;
  try { if (MPV.fullscreen){ MPV.fullscreen = false; await mpvCmd('fullscreen', false); } } catch(e){}
  MPV.active = false;
  clearInterval(MPV.timer);
  MPV.timer = null;
  try { await fetch('/api/mpv/quit', { method: 'POST' }); } catch(e){}
  MPV.v = null;
}

      EMPTY_SHARE:    ['分享内容为空', '里面没有文件了。'],

    };
    const [big, msg] = map[code] || ['播放失败', d.error || '未知错误'];

      <div class="acts">
        <button class="pl-warn-btn" onclick="closePlayer()">换个片源</button>
        ${code === 'NEED_LOGIN' ? '<button class="pl-warn-btn" onclick="closePlayer();document.getElementById(\'quarkAcct\').click()">去登录</button>' : ''}
      </div>`, {spinner:false});
    return;
  }

  // ── 成功：填信息
  const gb = d.size ? d.size / 1073741824 : 0;
  const sizeTxt = gb >= 1 ? gb.toFixed(2) + ' GB'
                 : (d.size ? Math.round(d.size / 1048576) + ' MB' : '');
  $('#plTitle').textContent = d.name || title || '播放';
  $('#plSub').textContent = (sizeTxt ? sizeTxt + ' · ' : '')
    + '原画直连'
    + (d.reused ? ' · 已缓存' : '');
  plFillInfo(d.name, d.size, [
    {text: (d.ext || '').replace('.', '').toUpperCase() || '未知格式'},
    d.playable ? {text:'可直接播放', cls:'ok'} : {text:'可能需外部播放器', cls:'warn'}
  ]);

  // 记住当前上下文，选集切换要用
  _plCtx = {url: url, pwd: pwd, title: title,
            audio: d.audio_info || null, fid: d.fid || '',
            name: d.name || ''};

  // 文件名没写音频编码的 MKV：后台读文件头确认（不影响起播）
  if ((!d.audio_info || d.audio_info.browser_ok === null || d.audio_info.browser_ok === undefined)
      && /\.mkv$/i.test(d.name || '') && d.fid){
    setTimeout(() => {
      fetch('/api/audio?fid=' + encodeURIComponent(d.fid))
        .then(r => r.json())
        .then(j => {
          const a = (j && j.data) || {};
          // 只把探测结果存起来给音轨面板用，不再自动弹窗
          try {
            if (a && a.codec) {
              window.__lastAudioProbe = a;
              if (typeof AST !== 'undefined' && AST) AST.probe = a;
            }
          } catch(e){}
        }).catch(()=>{});
    }, 2500);
  }

  // 杜比音轨：自动启用 AAC 流（不换片源，视频静音、声音走转码流）
  if (!_mpvOn && !window._mpvBusy && !(typeof MPV !== 'undefined' && MPV.active) && d.audio_info && d.audio_info.browser_ok === false && d.fid){
    setTimeout(async () => {
      if (!alive()) return;
      if (window._preferWeb !== true){
        // 外部播放器优先：mpv（无边框贴住播放区）→ PotPlayer → 网页转码
        let r = null;
        try {
          // 等布局稳定（最多 2 秒），并换算成屏幕坐标
          let vr = v.getBoundingClientRect();
          for (let i = 0; i < 10 && (vr.width < 320 || vr.height < 200); i++){
            await new Promise(res => setTimeout(res, 200));
            vr = v.getBoundingClientRect();
          }
          let w = vr.width, h = vr.height, x, y;
          if (w < 320 || h < 200){
            w = Math.min(1280, Math.round(window.outerWidth * 0.8));
            h = Math.round(w * 9 / 16);
            const wr = (document.querySelector('.pl-stage') || v).getBoundingClientRect();
            x = window.screenX + (wr.left || 0);
            y = window.screenY + ((window.outerHeight - window.innerHeight) || 0) + (wr.top || 0);
          } else {
            x = window.screenX + vr.left;
            y = window.screenY + ((window.outerHeight - window.innerHeight) || 0) + vr.top;
            w = vr.width; h = vr.height;
          }
          r = await openMpv(d.fid, title, { x: x, y: y, w: w, h: h });
        } catch(e){}
        if (!alive()) return;
        if (!r || !r.opened){
          r = await openPotPlayer(d.fid, title);
          if (!alive()) return;
        }
        if (r && r.opened){
          // 外部播放器接管后停掉网页播放，别偷带宽
          try { v.__userPaused = true; v.pause(); v.muted = true; } catch(e){}
          try { stopLiveAAC(); } catch(e){}
          showExtNotice(title, () => {
            try { startLiveAAC(v, d.fid); v.play().catch(()=>{}); } catch(e){}
          });
          return;
        }
        window._noExtPlayer = true;
      }
      try { startLiveAAC(v, d.fid); } catch(e){}
    }, 300);
  }

  // 音轨不兼容（杜比）时不再自动弹窗：
  // Chrome+Windows 可硬解 E-AC3，且无音频设备时检测不可靠，容易误报。
  // 真无声时到「音轨」面板切 AAC 即可。

  // 选集
  renderEpisodes(d, url, pwd, title);

  // ── 一律原生播放：容器和编码都交给浏览器
  if (!alive()) return;   // 旧请求不许写回画面
  b.innerHTML = '<video id="plVideo" autoplay playsinline preload="auto"></video>';
  const v = $('#plVideo');
// B 方案：优先交给 mpv（本地原生解码 + 秒拖），失败再回退网页播放
if (window._preferWebPlayer !== true){
  try { _mpvOn = await mpvStart(v, d, title || d.name); } catch(e){ _mpvOn = false; }
  if (!alive()) return;
  if (_mpvOn){
    // mpv 模式下 video 没有 src，不会触发 loadeddata，
    // 控制条必须在这里手动绑定，否则按钮、快捷键全部失效
    try { plVeilHide(); } catch(e){}
    try { bindPlayerUI(); } catch(e){}
  }
}
  // 告诉音轨面板当前文件
  try { AST.fid = d.fid || ''; AST.aac = null; AST.cur = 0; }
  catch(e){}
  renderSubs(d);

  plVeil('正在缓冲…');
  if (!_mpvOn) v.src = d.stream;

  /* 静音状态同步（带图标反馈） */
  const setMuted = (on) => {
    v.muted = !!on;
    const mb = $('#plMute');
    if (mb) mb.style.opacity = on ? '.45' : '.88';
  };

  /* 显式起播：自动播放被拒就静音重试，再不行等用户点一下 */
  let _kicking = false;
  const kickPlay = () => {
    if (!alive() || _kicking) return;
    if (!v.paused) return;
    _kicking = true;
    const done = () => { _kicking = false; };
    const p = v.play();
    if (!p || !p.catch){ done(); return; }
    p.then(done).catch(() => {
      // 静音后浏览器一定允许自动播
      setMuted(true);
      const p2 = v.play();
      if (p2 && p2.catch){
        p2.then(done).catch(() => {
          done();
          // 最后退路：用户任意点击即起播并恢复声音
          const once = () => {
            setMuted(false);
            v.play().catch(()=>{});
          };
          document.addEventListener('click', once, {once:true});
        });
      } else { done(); }
    });
  };

  v.addEventListener('loadeddata', () => {
    if (!alive()) return;
    plVeilHide();
    bindPlayerUI();
    kickPlay();
  }, {once:true});

  // 某些容器 loadeddata 偏早，canplay 再补一次
  v.addEventListener('canplay', () => {
    if (alive()){ plVeilHide(); kickPlay(); }
  });

  v.addEventListener('error', () => {
    if (!alive()) return;
    const code = (v.error && v.error.code) || 0;
    const why = code === 4
      ? '这个编码浏览器解不了'
      : (code === 2 ? '片源读取中断' : '这个文件加载失败');
    const extTxt = (d.ext || '').replace('.', '').toUpperCase() || '未知格式';
    plVeil(`<div class="big">${esc(why)}</div>
      <div class="msg">${esc(extTxt)} 容器，当前浏览器无法解码。<br>换个片源，或用夸克客户端打开。</div>
      <div class="acts"><button class="pl-warn-btn" onclick="closePlayer()">换个片源</button></div>`,
      {spinner:false});
  }, {once:true});

  // 缓冲中断后浏览器会停在 paused，这里兜一下自动续播
  v.addEventListener('waiting', () => {
    if (!alive()) return;
    setTimeout(() => {
      // 用户主动暂停的，绝不自动续播（否则暂停按钮会被顶回来）
      if (alive() && v.paused && !v.__userPaused) kickPlay();
    }, 1200);
  });

  // 8 秒还没出画面：多半是带宽跟不上，给个提示但继续等
  setTimeout(() => {
    if (alive() && v.readyState < 2) plVeil('网络较慢，继续缓冲…');
  }, 8000);

  // 推荐并行加载，不阻塞播放
  loadRecs((d.name || title || '').replace(/\.[a-z0-9]{2,4}$/i, '').trim(), [], 'movie');
}

        <div class="row-track">${r.items.map(cardHtml).join('')}</div>
      </section>`).join('')}
  </div>`;

  $$('.card').forEach(c => { c.onclick = () => openMovieDetail(_mdItemFromCard(c)); });

    $$('.row').forEach((row,i)=>{

      });
    });
  }
}

let _bwCache = {};

const FSTATE = {
  media: 'movie',        // movie | tv
  region: '全部',
  year: '全部',
  genre: '全部',
  sort: '综合',           // 综合 | 时间 | 评分
  page: 0,
};

/* 筛选项数据（来自 /api/filter/options，失败时用内置兜底） */
let _fvOpts = null;
let FREGIONS = [];
let FYEARS = [];
let FGENRES = [];
const FSORTS = ['综合', '时间', '评分'];

const F_FALLBACK = {
  regions: ['华语', '欧美', '韩国', '日本', '美国', '英国', '法国', '泰国', '印度'],
  years: Array.from({ length: 21 }, (_, i) => String(2026 - i)),

           '剧情', '动画', '犯罪', '冒险', '奇幻', '战争', '传记', '历史'],
};

function fOptsPick(){
  const o = _fvOpts || {};
  const pick = (a, b) => ['全部'].concat(((a && a.length) ? a : b).map(String));
  FREGIONS = pick(o.regions, F_FALLBACK.regions);
  FGENRES  = pick(o.genres,  F_FALLBACK.genres);
  FYEARS   = pick(o.years,   F_FALLBACK.years);
}

function frowHtml(label, items, key){
  const btns = (items || []).map(v =>
    `<button class="fo${FSTATE[key] === v ? ' on' : ''}" data-k="${key}"`
    + ` data-v="${esc(String(v))}">${esc(String(v))}</button>`
  ).join('');
  return `<div class="frow"><div class="fk">${label}</div>`
       + `<div class="fv">${btns}</div></div>`;
}

async function openFilter(media){
  if (media) FSTATE.media = media;
  FSTATE.page = 0;
  stopHeroTimer();
  setTab(media === 'tv' ? 'tv' : (media === 'movie' ? 'movie' : 'filter'));
  $('#hero').classList.add('hidden');
  $('#footer').classList.add('hidden');
  $('#rows').innerHTML = '';

  if (!_fvOpts){
    try {
      const j = await (await fetch('/api/filter/options')).json();
      _fvOpts = j.data || {};
    } catch(e){ _fvOpts = {}; }
  }
  fOptsPick();

  $('#rows').innerHTML = `
  <div class="fv-wrap">
    <div class="fv-head">
      <h1 class="fv-title">${FSTATE.media === 'tv' ? '浏览剧集' : '浏览影片'}</h1>
      <span class="fv-count" id="fvCount"></span>
    </div>
    <div class="fv-sel" id="fvSel"></div>

    <div class="frows">
      ${frowHtml('地区', FREGIONS, 'region')}
      ${frowHtml('年份', FYEARS, 'year')}
      ${frowHtml('类型', FGENRES, 'genre')}
      ${frowHtml('排序', FSORTS, 'sort')}
    </div>

    <div class="fv-grid" id="fvGrid"></div>

  </div>`;

  $$('.fo').forEach(b => b.onclick = () => {
    FSTATE[b.dataset.k] = b.dataset.v;

    $$('.fo').forEach(x => {

    });

function fQuery(){
  const q = new URLSearchParams();
  if (FSTATE.region !== '全部') q.set('regions', FSTATE.region);
  if (FSTATE.year !== '全部') q.set('year', FSTATE.year);
  if (FSTATE.genre !== '全部') q.set('genres', FSTATE.genre);
  const sortMap = {'综合':'U', '时间':'S', '评分':'R'};
  q.set('sort', sortMap[FSTATE.sort] || 'U');
  q.set('media', FSTATE.media);
  q.set('start', String(FSTATE.page * 40));
  return q;
}

function fSelText(){
  const parts = [];
  if (FSTATE.region !== '全部') parts.push(FSTATE.region);
  if (FSTATE.genre !== '全部') parts.push(FSTATE.genre);
  if (FSTATE.year !== '全部') parts.push(FSTATE.year);
  return parts.length ? parts.join(' · ') : '全部影片';
}

async function runFilter(reset){
  const g = $('#fvGrid'), cnt = $('#fvCount'), sel = $('#fvSel'), more = $('#fvMore');
  if (!g) return;
  if (reset){
    g.innerHTML = Array.from({length:12}, ()=>'<div class="card-skel"></div>').join('');
    if (more) more.innerHTML = '';
  }
  if (sel) sel.innerHTML = '已选择：<b>' + esc(fSelText()) + '</b>';
  if (cnt) cnt.textContent = '加载中…';

  try {
    const j = await (await fetch('/api/filter?' + fQuery().toString())).json();
    const items = ((j.data||{}).items) || [];
    if (cnt) cnt.textContent = items.length ? (items.length + ' 部') : '';

    if (!items.length){
      g.innerHTML = '<div class="fv-empty" style="grid-column:1/-1">'
        + '这个组合没有结果，换个条件试试</div>';
      return;
    }

    const html = items.map(cardHtml).join('');
    if (reset) g.innerHTML = html;
    else g.insertAdjacentHTML('beforeend', html);

    // 卡片点击 —— 和首页保持一致
    $$('.card').forEach(c => { c.onclick = () => openMovieDetail(_mdItemFromCard(c)); });
    if (window.Motion) Motion.animate(g, {opacity:[0,1]}, {duration:.3});

    if (more){
      more.innerHTML = items.length >= 20
        ? '<button class="btn btn-gray" id="fvMoreBtn">加载更多</button>' : '';
      const mb = $('#fvMoreBtn');
      if (mb) mb.onclick = () => { FSTATE.page += 1; runFilter(false); };
    }
  } catch(e){
    if (cnt) cnt.textContent = '';
    g.innerHTML = '<div class="fv-empty" style="grid-column:1/-1">' + esc(e.message) + '</div>';
  }
}

/* ----------- SPLASH controller -----------
   纯 canvas 渲染，不碰 CSS 变换 / clip-path。
   量化时间轴（ms，总计 5260）：
      0- 500   右竖从上往下
    500-1800   斜杠沿 45 度折过去
   1800-2200   左竖收笔  -> 平底 N
   2200-2600   N 在中心定格
   2600-3450   透视后退收缩
   3450-3700   N 左移到位
   3700-4120   N 底部由平变斜
   4120-4540   ETFLIX 淡入（出来即弧形）
   4540-5260   定格
------------------------------------------ */
const SPLASH_SEEN_KEY = 'flixer_splash_seen_v1';

const splash = (()=>{
  const el = $('#splash'), bar = $('#splBar'), fill = bar && bar.querySelector('i');
  const cvs = $('#splCanvas');

  // ── 开屏规则 ──
  //   只有「同一标签页刷新」才沿用"已看过"的标记；
  //   从浏览器导航页/别的站点重新进来，一律重新播。
  try {
    const navEntry = (performance.getEntriesByType &&
                      performance.getEntriesByType('navigation')[0]) || {};
    const navType = navEntry.type || 'navigate';
    const isReload = (navType === 'reload');
    const seen = sessionStorage.getItem(SPLASH_SEEN_KEY);
    const q0 = new URLSearchParams(location.search);
    const force = q0.get('splash') === '1';
    const frozen = !isNaN(parseFloat(q0.get('splashat')));

    if (!force && !frozen){
      if (isReload && seen){
        // 刷新且看过 -> 跳过
        if (el) el.style.display = 'none';
        document.body.classList.remove('locked-boot');
        return { ready: function(){}, fail: function(){} };
      }
      // 新导航 / 前进后退 -> 清掉旧标记，重新播
      if (!isReload){
        try { sessionStorage.removeItem(SPLASH_SEEN_KEY); } catch(e){}
      }
    }
  } catch(e){}


  const BLACK = 800;                 // 开头纯黑缓冲（仪式感）
  const TOTAL = 6160;
  const T = { bar3:500, slash:1800, bar1:2200, hold:2600,
              shrink:3450, slide:3900, arc:4300, reveal:4595 };

  const t0 = performance.now();
  let done = false, dataReady = false, progress = 0, timerPid = null, rafPid = 0;

  const WW = 867, WH = 233;
  const N_CX = 59.5, N_CY = 116.5, N_WW = 119;
  // 斜杠的方向：底边中点 -> 顶边中点（用于折纸推进）
  const SL_BX = (82 + 119) / 2;          // 底边中点 x
  const SL_TX = (0 + 35) / 2;            // 顶边中点 x
  const SL_ANG = Math.atan2(-233, SL_TX - SL_BX);   // 约 -109.6 度
  const LW = 900, LH = 360;
  const OFF_X = (LW - WW) / 2, OFF_Y = (LH - WH) / 2;
  const TX_CENTER = LW / 2 - (OFF_X + N_CX);

  const RATIO = WW / WH;
  let H_END = 234, W_END = 870, H_BIG = 324, S0 = 1.385, DPR = 1;
  let ctx = null, gL = null, gS = null, gR = null, gRest = null;
  let COLOR_LIT = '#e30511', COLOR_SHADE = '#b0050f';

  const P1 = new Path2D('M0 0H37V233H0V0Z');
  const P2 = new Path2D('M82 233H119L35 0H0L82 233Z');
  const P3 = new Path2D('M82 0H119V233H82V0Z');

  const ETS = [
    'M255.1 171.6V208.2L153.6 215.8V178.5L255.1 171.6Z',
    'M239.9 85.2V121.2L153.6 121.5V85.6L239.9 85.2Z',
    'M190.1 213.1L153.6 215.8V0H190.1V213.1Z',
    'M255 0H153.6V36.4H255V0Z',
    'M317 0V204.6L353.4 203.2V0H317Z',
    'M391.7 0H278.7V36.4H391.7V0Z',
    'M501 84H415V120H501V84Z',
    'M414.8 0V202.2H451.8V0H414.8Z',
    'M516.8 0H414.8V36.4H516.8V0Z',
    'M540.5 0H576.9V205.9L540.5 204.1V0Z',
    'M540.5 167.5L639.5 173.1V209.1L540.5 204.1V167.5Z',
    'M669.2 0H705.7V214.3L669.2 211.2V0Z',
    'M737 0L825.1 227.2L866.8 232.8L776.5 0H737Z',
    'M733.1 216.8L771.5 220.8L866.8 0H826.7L733.1 216.8Z'
  ].map(function(d){ return new Path2D(d); });

  // 每个 path 属于哪个字母：E(0-3) T(4-5) F(6-8) L(9-10) I(11) X(12-13)
  const ET_GROUP = [0,0,0,0, 1,1, 2,2,2, 3,3, 4, 5,5];
  const ET_STEP = 35;    // 字母间隔 ms（视频实测整个显现窗口只有约 0.15s）
  const ET_FADE = 120;   // 单个字母淡入时长 ms

  const cl = function(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); };
  const easeIO = function(p){ return p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2; };
  const smooth = function(p){ return p*p*(3-2*p); };

  function setup(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    // 字标宽固定为视口宽 56%（各窗口比例统一）；
    // 若窗口太矮，再按高度收缩，保证动画完整不出屏
    var wTarget = window.innerWidth * 0.56;
    var hTarget = wTarget / RATIO;
    var hMax = window.innerHeight * 0.34;
    if (hTarget > hMax){ hTarget = hMax; wTarget = hTarget * RATIO; }
    W_END = wTarget;
    H_END = hTarget;

    // 大 N 的放大倍数固定，动效节奏任何窗口都一致
    S0 = 1.385;
    H_BIG = H_END * S0;

    var k = W_END / WW;
    cvs.width  = Math.round(LW * k * DPR);
    cvs.height = Math.round(LH * k * DPR);
    cvs.style.width  = (LW * k).toFixed(1) + 'px';
    cvs.style.height = (LH * k).toFixed(1) + 'px';

    ctx = cvs.getContext('2d', { alpha: true });
    ctx.setTransform(k * DPR, 0, 0, k * DPR, 0, 0);

    function mk(a,b,c){
      var g = ctx.createLinearGradient(0, 0, 0, WH);
      g.addColorStop(0, a); g.addColorStop(.42, b); g.addColorStop(1, c);
      return g;
    }
    gL = mk('#f8111d', '#d80812', '#8a040a');
    gS = mk('#ff3a45', '#e50914', '#b0060e');
    gR = mk('#c9080f', '#a8060e', '#6e0308');
    // 视频实测：最终 NETFLIX 通体 (227,5,17)；大 N 的斜杠同亮，两竖偏暗 (176,5,15)
    // 渲染约 4% 衰减，源码值上提补偿
    COLOR_LIT   = '#e30511';   // (227,5,17)
    COLOR_SHADE = '#b0050f';   // (176,5,15)
    gRest = COLOR_LIT;
  }

  function drawN(grow, scale, txCenter, arcK, shadeK){
    if (!ctx) return;
    ctx.save();
    ctx.translate(OFF_X + txCenter, OFF_Y);
    ctx.translate(N_CX, N_CY);
    ctx.scale(scale, scale);
    ctx.translate(-N_CX, -N_CY);

    // N 底部由平变斜：用 clip 限定绘制区域（比 destination-out 安全）
    if (arcK > 0){
      var cut0 = 10.7 * arcK;
      ctx.beginPath();
      ctx.moveTo(-6, -6);
      ctx.lineTo(N_WW + 6, -6);
      ctx.lineTo(N_WW + 6, WH - cut0);
      ctx.lineTo(-6, WH);
      ctx.closePath();
      ctx.clip();
    }

    var A3 = T.bar3 / T.bar1;
    var A2 = (T.slash - T.bar3) / T.bar1;
    var A1 = (T.bar1 - T.slash) / T.bar1;

    // 两竖用暗色、斜杠用亮色 —— 这是原版的横向明暗结构
    // shadeK 从 1 渐到 0 时，两竖逐步提亮，最终与 ETFLIX 同色
    var sk = (shadeK === undefined) ? 1 : shadeK;
    var sideCol = sk > 0.001
      ? 'rgb(' + Math.round(176 + (227 - 176) * (1 - sk)) + ',5,15)'
      : COLOR_LIT;
    var litCol = COLOR_LIT;

    // 右竖
    var a3 = cl(grow / A3);
    if (a3 > 0){
      var e3 = easeIO(a3);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, N_WW, WH * e3); ctx.clip();
      ctx.fillStyle = sideCol; ctx.fill(P3); ctx.restore();
    }

    // 左竖
    var a1 = cl((grow - A3 - A2) / A1);
    if (a1 > 0){
      var e1 = easeIO(a1);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, N_WW, WH * e1); ctx.clip();
      ctx.fillStyle = sideCol; ctx.fill(P1); ctx.restore();
    }

    // 斜杠最后画 —— 这样它与左竖重叠的那块会显示成斜杠的亮色
    var a2 = cl((grow - A3) / A2);
    if (a2 > 0){
      var e2 = smooth(a2);
      var d = 275 * e2;                       // 斜杠长度约 247，留一点余量
      ctx.save();
      ctx.translate(SL_BX, WH);               // 从底边中点出发
      ctx.rotate(SL_ANG);                     // 沿斜杠真实方向（-109.6 度）
      ctx.beginPath(); ctx.rect(-300, -300, d + 300, 600); ctx.clip();
      ctx.rotate(-SL_ANG); ctx.translate(-SL_BX, -WH);
      ctx.fillStyle = litCol; ctx.fill(P2);
      // 折的过程中提亮这一条，折完亮度归零 -> 颜色与 ETFLIX 完全一致
      if (a2 < 1){
        ctx.globalAlpha = 0.30 * (1 - a2);
        ctx.fillStyle = '#ff7076';
        ctx.fill(P2);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    ctx.restore();
  }

  // rel: 距 ETFLIX 开始多少毫秒；按字母依次淡入
  function drawRest(rel){
    if (!ctx || rel <= 0) return;
    ctx.save();
    ctx.fillStyle = gRest;              // 不设就会用默认黑色
    ctx.translate(OFF_X, OFF_Y);
    for (var i = 0; i < ETS.length; i++){
      var g = ET_GROUP[i];
      var a = (rel - g * ET_STEP) / ET_FADE;
      if (a <= 0) continue;
      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.fill(ETS[i]);
    }
    ctx.restore();
  }

  function renderAt(ms){
    if (!ctx) return;
    ctx.clearRect(0, 0, LW, LH);

    // 开头一段时间什么都不画 —— 纯黑，给一点仪式感
    ms -= BLACK;
    if (ms <= 0) return;

    var scale = S0, txC = TX_CENTER;
    if (ms > T.hold){
      var k1 = cl((ms - T.hold) / (T.shrink - T.hold));
      scale = S0 + (1 - S0) * easeIO(k1);
    }
    if (ms > T.shrink){
      var k2 = cl((ms - T.shrink) / (T.slide - T.shrink));
      // easeInOutSine：两端速度都趋零，中段柔和加速，最不容易看到顿挫
      var e2m = -(Math.cos(Math.PI * k2) - 1) / 2;
      txC = TX_CENTER * (1 - e2m);
      // 移动中轻微收缩再回弹，让位移有体积感而不是平移贴图
      scale = 1 - 0.05 * Math.sin(k2 * Math.PI);
    }

    var grow = cl(ms / T.bar1);
    var arcK = cl((ms - T.slide) / (T.arc - T.slide));
    // 左移结束后，两竖逐步提亮，进入 NETFLIX 的纯色状态
    var shadeK = 1 - cl((ms - T.slide) / (T.reveal - T.slide));
    drawN(grow, scale, txC, arcK, shadeK);

    drawRest(ms - T.arc);
  }

  function frame(now){
    if (done) return;
    renderAt(now - t0);
    rafPid = requestAnimationFrame(frame);
  }

  function tick(){
    if (done) return;
    var ms = performance.now() - t0;
    var target = Math.min(93, (ms / TOTAL) * 93);
    progress += (target - progress) * 0.2 + 0.04;
    if (dataReady) progress += 2.4;
    progress = Math.min(100, progress);
    if (fill) fill.style.width = progress.toFixed(1) + '%';
    timerPid = setTimeout(tick, 90);
  }

  function maybeFinish(){
    var waited = performance.now() - t0;
    if (waited < TOTAL) { setTimeout(maybeFinish, TOTAL - waited + 20); return; }
    finish();
  }

  function finish(){
    if (done) return;
    done = true;
    var elapsed = performance.now() - t0;
    clearTimeout(timerPid);
    cancelAnimationFrame(rafPid);
    // 只有动画【真的完整播完】才记住"已看过"。
    // 中途刷新不会走到这里；点跳过时 elapsed 远小于 TOTAL，也不会记，
    // 所以下次进来仍然会重新播放。
    if (elapsed >= TOTAL - 150){
      try { sessionStorage.setItem(SPLASH_SEEN_KEY, '1'); } catch(e){}
    }
    if (fill) fill.style.width = '100%';
    setTimeout(function(){
      el.classList.add('bye');
      document.body.classList.remove('locked-boot');
      if (window.Motion){
        var hero = $('#hero');
        if (hero && !hero.classList.contains('hidden')){
          Motion.animate(hero, {opacity:[0,1]}, {duration:.8});
        }
      }
      setTimeout(function(){ el.style.display = 'none'; }, 850);
    }, 200);
  }

  setup();
  document.body.classList.add('locked-boot');
  $('#splSkip').onclick = finish;

  // 兜底：不管首页数据到没到，动画放完就收场（否则数据慢时会一直卡在开屏）
  setTimeout(function(){ finish(); }, TOTAL + 500);

  var q = new URLSearchParams(location.search);
  var at = parseFloat(q.get('splashat'));
  if (!isNaN(at)){
    renderAt(at * 1000);
    done = true; clearTimeout(timerPid);
    if (fill) fill.style.width = '100%';
    return { ready: function(){}, fail: function(){} };
  }

  rafPid = requestAnimationFrame(frame);
  tick();

  return {
    ready: function(){ dataReady = true; maybeFinish(); },
    fail: function(){ finish(); }
  };
})();



/* ─────────── 前进/后退（history 栈）─────────── */
let navDepth = 0;

function pushView(v, title){
  // 只用于浏览器前进/后退的粗粒度记录，不再参与弹层开关
  try {
    if (!history.state || history.state.view !== v){
      history.pushState({view: v, q: title || ''}, '',
        v === 'home' ? '/' : ('#view=' + encodeURIComponent(v)));
      navDepth++;
    }
  } catch(e){}
}

addEventListener('popstate', (ev)=>{
  // 无论后退到哪，都先把站内的浮层收掉，绝不让页面离开本站
  const pw = $('#plWrap');
  if (pw && pw.classList.contains('open')){
    // 只关播放器，不再 pushState（补历史会让栈越积越深，永远退不回上一级）
    closePlayer();
    return;
  }
  const dw = $('#detailWrap');
  if (dw && dw.classList.contains('open')){
    closeDetail(true);             // 关详情
    return;
  }
  const st = ev.state || {};
  if (st.view === 'search' && st.q){
    renderSearchView(st.q);
  } else if (st.view === 'movie' || st.view === 'tv'){
    openBrowse(st.view);
  } else if (st.view === 'filter'){
    openFilter();
  } else {
    goHomeView();
  }
  // 退到根了，再垫一条，防止下一次后退直接离开
  ensureHistoryRoot();
});

function renderSearchView(title){
  stopHeroTimer();
  setTab('search');
  $('#hero').classList.add('hidden');
  state.lastSearch = title;
  runSearch(title, true);   // true = 不 push history
}

function goHomeView(){
  stopHeroTimer();
  setTab('home');
  $('#searchbox').classList.remove('open');
  $('#hero').classList.remove('hidden');
  if (state.home){
    renderRows(state.home.rows);
    buildHero(state.hero);
  }
  scrollTo({top:0, behavior:'smooth'});
}

/* ─────────── 夸克账号状态 ─────────── */
const quarkState = { logged: false, nick: '', vip: '' };

async function refreshQuark(){
  const btn = $('#quarkAcct'), txt = $('#qaTxt');
  try {
    const j = await (await fetch('/api/quark/status')).json();
    const d = j.data || {};
    if (d.logged_in){
      quarkState.logged = true;
      quarkState.nick = d.nick || '夸克用户';
      quarkState.vip = d.vip || '';
      btn.classList.add('on');
      txt.textContent = quarkState.nick;
      btn.title = '夸克网盘 · ' + (quarkState.vip || '已登录') + '（点击管理）';
    } else {
      quarkState.logged = false;
      btn.classList.remove('on');
      txt.textContent = '夸克未登录';
      btn.title = '点击登录夸克网盘';
    }
  } catch(e){
    txt.textContent = '夸克离线';
    btn.classList.remove('on');
  }
}
$('#quarkAcct').onclick = ()=> openQuarkPanel();

function openQuarkPanel(){
  openDetailShell();
  const logged = quarkState.logged;
  $('#detail').innerHTML = `
  <div style="padding:34px 38px 40px">
    <button class="btn btn-gray" onclick="closeDetail()" style="margin-bottom:22px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>返回</button>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">
      <div style="width:46px;height:46px;border-radius:10px;display:grid;place-items:center;
        background:${logged?'linear-gradient(135deg,#0e2740,#123a5c)':'#242424'};
        border:1px solid ${logged?'#1b4570':'rgba(255,255,255,.1)'}">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="${logged?'#6fb6f5':'#888'}" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div>
        <div style="font-size:22px;font-weight:800;letter-spacing:-.5px">
          ${logged ? esc(quarkState.nick) : '夸克网盘'}
        </div>
        <div style="font-size:13px;color:var(--fg-3);margin-top:3px">
          ${logged ? esc(quarkState.vip || '已登录') : '未登录 · 登录后可转存并播放原画'}
        </div>
      </div>
    </div>

    ${logged ? `
      <div class="qk-box">
        <div class="qk-row"><span>状态</span><b style="color:var(--green)">● 已连接</b></div>
        <div class="qk-row"><span>用途</span><b>转存分享 → 取直链 → 播放</b></div>
        <div class="qk-row"><span>播放链路</span><b>强制直连（不走代理）</b></div>
      </div>
      <button class="btn btn-gray" onclick="logoutQuark()" style="margin-top:20px">退出登录</button>
    ` : `
      <div class="qk-box">
        <div class="qk-row"><span>为什么要登录</span><b>夸克直链和转码需要账号鉴权</b></div>
        <div class="qk-row"><span>会保存什么</span><b>仅本机 Cookie，不上传</b></div>
      </div>
      <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-white" onclick="loginQuarkQR()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" style="margin-right:6px"><rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
            <path d="M14 14h3v3h-3zM20 14h1M14 20h1M18 20h3v-2"/></svg>
          扫码登录
        </button>
        <button class="btn btn-gray" onclick="loginQuarkCookie()">粘贴 Cookie</button>
      </div>
      <div id="qkMsg" style="margin-top:14px;font-size:13px;color:var(--fg-3);line-height:1.6"></div>
    `}
  </div>`;
}

async function loginQuarkCookie(){
  const msg = $('#qkMsg');
  const raw = prompt('粘贴夸克网盘 Cookie（浏览器 F12 → Network → 任意请求 → Cookie 复制整段）');
  if (!raw) return;
  msg.innerHTML = '<span class="spin"></span> 正在验证…';
  try {
    const r = await fetch('/api/quark/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({cookie: raw.trim()})
    });
    const j = await r.json();
    if (j.ok){ msg.innerHTML = '✓ 登录成功'; await refreshQuark(); setTimeout(()=>{ closeDetail(); openQuarkPanel(); }, 600); }
    else msg.innerHTML = '<span style="color:#ff8585">✗ ' + esc(j.error || '登录失败') + '</span>';
  } catch(e){ msg.innerHTML = '<span style="color:#ff8585">✗ ' + esc(e.message) + '</span>'; }
}

let _qrTimer = null;

async function loginQuarkQR(){
  const msg = $('#qkMsg');
  if (!msg) return;
  msg.innerHTML = '<span class="spin"></span> 正在打开夸克登录页…';
  try {
    const j = await (await fetch('/api/quark/qr/start', {method:'POST'})).json();
    if (!j.ok){
      msg.innerHTML = '<span style="color:#ff8585">✗ ' + esc(j.error || '启动失败') + '</span>';
      return;
    }
    msg.innerHTML =
      '<b style="color:#8ec8ff">已弹出登录窗口</b><br>' +
      '<span style="color:var(--fg-3)">请用手机夸克 App 扫码，扫完会自动完成，窗口会自己关掉。</span>';

    if (_qrTimer) clearInterval(_qrTimer);
    let tries = 0;
    _qrTimer = setInterval(async ()=>{
      tries++;
      if (tries > 180) {           // 约 6 分钟
        clearInterval(_qrTimer); _qrTimer = null;
        msg.innerHTML = '<span style="color:#ff8585">✗ 超时了，重新点一次扫码登录</span>';
        return;
      }
      try {
        const p = await (await fetch('/api/quark/qr/poll')).json();
        if (p.state === 'logged_in'){
          clearInterval(_qrTimer); _qrTimer = null;
          msg.innerHTML = '✓ 登录成功' +
            (p.nick ? '：' + esc(p.nick) : '') +
            (p.vip ? ' · ' + esc(p.vip) : '');
          await refreshQuark();
          setTimeout(()=>{ closeDetail(); openQuarkPanel(); }, 800);
        } else if (p.state === 'idle'){
          clearInterval(_qrTimer); _qrTimer = null;
          msg.innerHTML = '<span style="color:#ff8585">✗ 登录窗口已关闭，未完成登录</span>';
        }
      } catch(e){ /* 网络抖动忽略 */ }
    }, 2000);
  } catch(e){
    msg.innerHTML = '<span style="color:#ff8585">✗ ' + esc(e.message) + '</span>';
  }
}

async function logoutQuark(){
  if (_qrTimer) { clearInterval(_qrTimer); _qrTimer = null; }
  try { await fetch('/api/quark/qr/cancel', {method:'POST'}); } catch(e){}
  try { await fetch('/api/quark/logout', {method:'POST'}); } catch(e){}
  await refreshQuark();
  closeDetail();
}

/* ─────────── BOOT ─────────── */
(async function boot(){
  ensureHistoryRoot();     // 先垫一条本站记录，防止后退直接退出
  refreshQuark();
  const rowsEl = $('#rows');
  rowsEl.innerHTML = Array.from({length:3},()=>
    `<section class="row"><div class="row-head">加载中…</div>
     <div class="row-track" style="padding-bottom:10px">${Array.from({length:7},()=>'<div class="card-skel"></div>').join('')}</div></section>`
  ).join('');
  try {
    const j = await (await fetch('/api/home')).json();
    if (!j.ok) throw new Error(j.error || '首页加载失败');
    state.home = j.data;
    buildHero(j.data.hero || []);
    renderRows(j.data.rows || []);
    $('#footer').innerHTML = `数据来源：豆瓣周榜 · showpaw 元数据 · PanSou 双源聚合 · 夸克免登录接口
      <br>片源均来自公开网络，仅供学习研究；登录夸克后可转存并以原画直链播放`;
    splash.ready();
  } catch(e){
    rowsEl.innerHTML = `<div class="err" style="margin:20px var(--pad)">${esc(e.message)}</div>`;
    splash.fail();
  }
  // 兜底：无论如何不超过 MAX_MS
  setTimeout(()=>splash.ready(), 9000);

  // splash-watchdog：兜底。任何情况下页面都不能被开屏层挡住
  setTimeout(() => {
    try {
      var sp = document.getElementById('splash');
      if (!sp) return;
      var cs = getComputedStyle(sp);
      if (sp.style.display !== 'none' && cs.opacity !== '0'){
        sp.classList.add('bye');
        sp.style.pointerEvents = 'none';
        setTimeout(() => { sp.style.display = 'none'; }, 900);
      }
    } catch(e){}
  }, 11000);

  // ── 临时诊断：把布局实测值写进 title，供 headless 抓取 ──
  if (location.search.includes('dbg=1')){
    setTimeout(()=>{
      try{
        const t = document.querySelector('.row-track');
        const c = t && t.querySelector('.card');
        const hd = document.querySelector('.row-head');
        const cs = t ? getComputedStyle(t) : null;
        const ccs = c ? getComputedStyle(c) : null;
        const padVal = getComputedStyle(document.documentElement).getPropertyValue('--pad').trim();
        document.title = 'DBG pad=' + padVal
          + ' trackLeft=' + (t?Math.round(t.getBoundingClientRect().left):'?')
          + ' cardLeft=' + (c?Math.round(c.getBoundingClientRect().left):'?')
          + ' cardML=' + (ccs?ccs.marginLeft:'?')
          + ' trackPL=' + (cs?cs.paddingLeft:'?')
          + ' headLeft=' + (hd?Math.round(hd.getBoundingClientRect().left):'?');
      }catch(e){ document.title = 'DBG ERR ' + e.message; }
    }, 2600);
  }
})();



/* ===== 详情弹窗关闭：全局委托（顶层执行，确保生效） ===== */
document.addEventListener('click', function(e){
  var dw = document.getElementById('detailWrap');
  if (!dw || !dw.classList.contains('open')) return;
  if (e.target === dw) { try { closeDetail(); } catch(err){} }
}, true);

document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var pw = document.getElementById('plWrap');
  if (pw && pw.classList.contains('open')) return;      // 播放器优先
  var dw = document.getElementById('detailWrap');
  if (dw && dw.classList.contains('open')){
    e.preventDefault();
    try { closeDetail(); } catch(err){}
  }
});
</script>
